id: kotlin
title: Kotlin Essentials
icon: braces
description: Null safety, idioms and the language features seniors are expected to know cold.
lessons:
  - id: kotlin-null-types
    title: Null safety & types
    questions:
      - type: single
        hint: "Follow the `?.` first: what does it produce when the receiver is null, and what does the operator after it do with that?"
        prompt: What does this print?
        code:
          source: |
            val name: String? = null
            println(name?.length ?: -1)
        options:
          - { id: a, text: "-1" }
          - { id: b, text: "null" }
          - { id: c, text: "NullPointerException" }
          - { id: d, text: "It does not compile" }
        answer: a
        explanation: "`?.` short-circuits to null when the receiver is null, and the Elvis operator `?:` supplies the fallback -1. No NPE is possible without `!!`."

      - type: multi
        hint: "What would the JVM need in order to represent \"not assigned yet\" for a primitive? And which keyword allows reassignment?"
        prompt: Select all statements that are true about `lateinit`.
        options:
          - { id: a, text: "It can only be applied to `var` properties" }
          - { id: b, text: "It works on `Int` properties because the compiler boxes them behind the scenes" }
          - { id: c, text: "The property type must be non-nullable" }
          - { id: d, text: "Reading it too early throws an exception (UninitializedPropertyAccessException)" }
          - { id: e, text: "It can be applied to `val` properties that are assigned in an `init` block" }
        answers: [a, c, d]
        explanation: "`lateinit` needs a mutable, non-null, non-primitive property. Primitives (Int, Boolean...) are not allowed because the JVM field would need a null sentinel. You can test with `::prop.isInitialized`."

      - type: fill
        hint: "One token makes a call that gives up quietly on null instead of throwing; the other supplies a fallback value."
        prompt: Return the length of `name`, or 0 when it is null.
        template: "val len = name[[1]]length [[2]] 0"
        bank: ["?.", "?:", "!!", "?", "::"]
        answers: ["?.", "?:"]
        explanation: "Safe call `?.` yields `Int?`; the Elvis operator `?:` unwraps it with a default. `!!` would throw instead."

      - type: single
        prompt: What do the two lines print?
        code:
          source: |
            data class P(val x: Int)
            val a = P(1)
            val b = P(1)
            println(a == b)
            println(a === b)
        options:
          - { id: a, text: "true, false" }
          - { id: b, text: "false, false" }
          - { id: c, text: "true, true" }
          - { id: d, text: "false, true" }
        answer: a
        explanation: "`==` is structural equality (calls `equals`, which data classes generate from the primary-constructor properties). `===` is reference identity, and these are two different instances."

      - type: single
        hint: "Between the null check and the use, could anything else change the property?"
        prompt: Why does this not compile?
        code:
          source: |
            class Box(var value: Any)

            fun describe(b: Box) {
                if (b.value is String) {
                    println(b.value.length)
                }
            }
        options:
          - { id: a, text: "`value` is a mutable property, so the compiler can't guarantee it is still a String on the next line" }
          - { id: b, text: "`Any` has no `length`: `is String` never narrows a type, so an explicit `as String` is needed" }
          - { id: c, text: "Smart casts only work inside `when` expressions, never after an `if` check" }
          - { id: d, text: "`Box` must be declared `open` or `data` before its properties can be smart cast" }
        answer: a
        explanation: "Smart casts only work when the value can't change between the check and the use: local `val`s, local `var`s not captured in a modifying lambda, and `val` properties without custom getters in the same module. Copy it to a local `val` (`val v = b.value`) first."

      - type: order
        prompt: Arrange the lines to form an extension function returning the second element, or null.
        lines:
          - "fun <T> List<T>.secondOrNull(): T? {"
          - "    if (size < 2) return null"
          - "    return this[1]"
          - "}"
        explanation: "Guard first, then index. The type parameter `T` belongs before the receiver type in the declaration."

      - type: open
        hint: "Compare when each one is initialised, whether it can be a `val`, and what thread-safety you get for free."
        prompt: When would you use `by lazy` instead of `lateinit var`?
        modelAnswer: "`by lazy` is for a `val` whose value is computed from an initializer lambda the first time it is read; it is thread-safe by default (SYNCHRONIZED mode) and works for any type, including primitives and nullables. `lateinit` is for a `var` that something else assigns after construction (dependency injection, test setup, lifecycle callbacks); there's no initializer, and reading it too early throws. So: lazy for expensive, self-contained, immutable values; lateinit when initialisation is external."
        keyPoints:
          - point: "lazy computes the value on first access via an initializer lambda (expensive/deferred work)"
            keywords: ["first access", "first use", "on demand", "initializer", "lambda", "deferred", "computed"]
          - point: "lazy gives an immutable val and is thread-safe by default; lateinit is a mutable var"
            keywords: ["thread-safe", "thread safe", "synchronized", "val", "immutable"]
          - point: "lateinit fits values assigned externally later (DI, tests, lifecycle) and throws if read too early"
            keywords: ["injection", "di", "setup", "lifecycle", "assigned later", "uninitialized", "externally", "test"]
        followUps:
          - when: missed
            point: 2
            prompt: "What are the thread-safety modes of `by lazy`, and when would you pick a non-default one?"
            modelAnswer: "The default, SYNCHRONIZED, uses a lock so the initializer runs at most once even with many threads. PUBLICATION lets several threads run the initializer concurrently but only the first result is kept, which suits cheap, idempotent initializers where you want to avoid locking. NONE uses no synchronisation and is only safe when the value is accessed from a single thread, as in a confined component or a test, because it avoids the lock overhead."
            keyPoints:
              - point: "SYNCHRONIZED (the default) uses a lock, so the initializer runs at most once"
                keywords: ["synchronized", "lock", "once", "default"]
              - point: "PUBLICATION: the initializer may run concurrently and the first result wins; fine for idempotent initializers"
                keywords: ["publication", "concurrent", "first", "idempotent"]
              - point: "NONE: no synchronisation, only for single-threaded access"
                keywords: ["none", "single thread", "single-thread", "no synchron"]
          - when: covered
            point: 1
            prompt: "What happens if the `lazy` initializer throws an exception?"
            modelAnswer: "The exception propagates to the caller and the value is not marked as initialised, so the next access runs the initializer again (for the default and publication modes). Nothing is cached for a failure, so a transient error can succeed on retry, but the initializer must be safe to run more than once."
            keyPoints:
              - point: "The exception propagates to the caller"
                keywords: ["propagat", "thrown", "rethrow", "caller"]
              - point: "The value stays uninitialised, so the next access runs the initializer again"
                keywords: ["again", "retry", "re-run", "rerun", "uninitialized", "uninitialised", "not cached", "next access"]

  - id: kotlin-idioms
    title: Idiomatic Kotlin
    questions:
      - type: single
        hint: "Think about what the compiler can prove when every subtype is declared in one place."
        prompt: What is the main benefit of a `sealed` hierarchy when used with `when`?
        options:
          - { id: a, text: "`when` can be exhaustive without an `else` branch, because all subtypes are known" }
          - { id: b, text: "Calls on sealed types are devirtualised, so `when` dispatch is faster at runtime" }
          - { id: c, text: "Subclasses may live in another module, so plugins can extend the hierarchy later" }
          - { id: d, text: "Each subtype gets generated `copy()` and `componentN()` methods, like a data class" }
        answer: a
        explanation: "Direct subtypes of a sealed type are known at compile time, so adding a new subtype turns every non-exhaustive `when` expression into a compile error. That is a safety net for evolving domain models. Sealed is a compile-time guarantee, not a performance feature; subclasses must live in the same package and module; and `copy()` comes from `data class`, not from `sealed`."

      - type: single
        prompt: What does this expression evaluate to?
        code:
          source: |
            val sb = StringBuilder().apply { append("a"); append("b") }
        options:
          - { id: a, text: "The StringBuilder (the receiver)" }
          - { id: b, text: "The string \"ab\" (from `toString()`)" }
          - { id: c, text: "Unit" }
          - { id: d, text: "The result of the last `append` call: a new StringBuilder instance" }
        answer: a
        explanation: "`apply` and `also` return the receiver; `let`, `run` and `with` return the lambda result. `apply` uses `this` inside the block, `also` uses `it`."

      - type: multi
        hint: "Look at what the compiler generates from the primary-constructor properties, and what a `data class` is not allowed to be."
        prompt: Select all statements that are true about `data class`.
        options:
          - { id: a, text: "`equals`/`hashCode` only use properties from the primary constructor" }
          - { id: b, text: "A data class can be declared `open`" }
          - { id: c, text: "`copy()` makes a shallow copy, which shares nested mutable lists" }
          - { id: d, text: "The primary constructor must have at least one parameter" }
          - { id: e, text: "The compiler also generates a no-arg constructor for frameworks such as JPA" }
        answers: [a, c, d]
        explanation: "Data classes can't be open, abstract, sealed or inner. `copy()` copies references, not deep structure, so a mutable list inside is shared. No no-arg constructor is generated (that's the JPA `no-arg` plugin's job)."

      - type: single
        prompt: How many times does the `map` lambda run?
        code:
          source: |
            val first = (1..1_000_000)
                .asSequence()
                .map { it * 2 }
                .filter { it % 3 == 0 }
                .first()
        options:
          - { id: a, text: "3" }
          - { id: b, text: "1,000,000" }
          - { id: c, text: "1" }
          - { id: d, text: "333,333" }
        answer: a
        explanation: "Sequences are lazy and process element by element. 1*2=2 and 2*2=4 fail the filter; 3*2=6 passes, and `first()` stops there. With a List, every operator would run over all 1,000,000 elements and allocate intermediate lists."

      - type: fill
        hint: "Narrow the list first, then reshape each element, and only then put the result in order."
        prompt: Build a sorted list of the names of active users.
        template: |
          val names = users
              .[[1]] { it.active }
              .[[2]] { it.name }
              .[[3]]()
        bank: ["filter", "map", "sorted", "flatMap", "forEach", "groupBy"]
        answers: ["filter", "map", "sorted"]
        explanation: "Narrow first (`filter`), then transform (`map`), then order the final, smaller list (`sorted`). Filtering early keeps the work small."

      - type: single
        hint: "Weigh what you pay at runtime against what the type system gives you at compile time."
        prompt: "What is the main purpose of `@JvmInline value class UserId(val raw: Long)`?"
        options:
          - { id: a, text: "Distinct compile-time types like UserId and OrderId, usually stored as a plain `Long`" }
          - { id: b, text: "It guarantees a `UserId` is never boxed, even inside generic lists or nullable types" }
          - { id: c, text: "It generates the data-class members: `equals`, `copy` and `componentN`" }
          - { id: d, text: "It makes each access to `raw` atomic, so coroutines can share it without locks" }
        answer: a
        explanation: "Value classes are erased to the underlying type where possible, avoiding allocation. They are boxed when used as a nullable, a generic type argument or through an interface, so it's not free everywhere and \"never boxed\" is false. They are not a concurrency tool (a `val` is simply immutable) and do not generate `copy` or `componentN`."

      - type: match
        hint: "Ask two questions of each: is the receiver `this` or `it`, and what does the block return?"
        prompt: Match each scope function to what it does.
        pairs:
          - { left: "`apply`", right: "Receiver is `this`; returns the receiver" }
          - { left: "`also`", right: "Receiver is `it`; returns the receiver" }
          - { left: "`let`", right: "Receiver is `it`; returns the lambda result" }
          - { left: "`run`", right: "Receiver is `this`; returns the lambda result" }
        explanation: "Two questions sort them: is the object `this` or `it`, and do you get the object back or the lambda's result? `apply`/`also` return the object (builders, side effects like logging); `let`/`run` return the result (transformations, null-checks with `?.let`)."

      - type: code
        hint: "Walk the words once; the first time you see a length, create its bucket, then add the word to it."
        prompt: "Write `groupByLength(words)`: return an object that maps each word length to the array of words with that length, in their original order (like Kotlin's `groupBy { it.length }`)."
        starter: |
          function groupByLength(words) {
            // your code
          }
        entry: groupByLength
        tests:
          - { args: [["a", "bb", "c", "dd", "eee"]], expect: { "1": ["a", "c"], "2": ["bb", "dd"], "3": ["eee"] } }
          - { args: [[]], expect: {} }
          - { args: [["hi", "hi"]], expect: { "2": ["hi", "hi"] } }
          - { args: [["abc", "d", "efg"]], expect: { "1": ["d"], "3": ["abc", "efg"] }, hidden: true }
        solution: |
          function groupByLength(words) {
            const groups = {};
            for (const w of words) (groups[w.length] ??= []).push(w);
            return groups;
          }
        kotlin: |
          fun groupByLength(words: List<String>): Map<Int, List<String>> =
              words.groupBy { it.length }
        explanation: "Grouping is a single pass: look up (or create) the bucket for the key and append. Kotlin's `groupBy` does exactly this and keeps the original order inside each group."

      - type: open
        hint: "Does the receiver's runtime type or its declared type choose the function? And what wins when a member has the same signature?"
        prompt: How are Kotlin extension functions resolved, and what's one pitfall of that?
        modelAnswer: "Extension functions are resolved statically, at compile time, based on the declared type of the receiver expression, not its runtime type. They compile to static methods taking the receiver as the first parameter, so they can't access private members and they aren't overridden polymorphically. If a class has a member with the same signature, the member always wins. A typical pitfall is expecting `animal.speak()` to dispatch on the runtime subclass when `speak` is an extension."
        keyPoints:
          - point: "Resolved statically on the declared receiver type, not dynamically (no polymorphic dispatch)"
            keywords: ["static", "compile time", "compile-time", "declared type", "not dynamic", "not polymorphic"]
          - point: "Compiled to a static method with the receiver as first parameter; cannot access private members"
            keywords: ["static method", "first parameter", "private", "utility"]
          - point: "A member function with the same signature always wins over an extension"
            keywords: ["member wins", "members win", "member always", "shadow", "takes precedence", "member function"]

  - id: kotlin-advanced
    title: Generics, inline & DSLs
    questions:
      - type: spot
        prompt: One of these assignments does not compile. Tap that line.
        source: |
          val strings: List<String> = listOf("a", "b")
          val anys: List<Any> = strings
          val names: MutableList<String> = mutableListOf("a")
          val things: MutableList<Any> = names
        answers: [4]
        explanation: "`List<out E>` is declared covariant: it only hands out elements, so a `List<String>` is a `List<Any>`. `MutableList<E>` is invariant because it also accepts elements: if `MutableList<String>` were a `MutableList<Any>`, you could add an `Int` through the `Any` view and corrupt the list of strings."

      - type: match
        prompt: Match each generics concept to what it means.
        pairs:
          - { left: "`out T`", right: "T only appears in output positions, so `Box<Dog>` can be used as a `Box<Animal>`" }
          - { left: "`in T`", right: "T only appears in input positions, so a handler of `Animal` can stand in for a handler of `Dog`" }
          - { left: "`Foo<*>` (star projection)", right: "Unknown type argument: reading is possible as the upper bound, writing is effectively impossible" }
          - { left: "`reified T`", right: "The type argument is available at runtime inside an inline function" }
        explanation: "Declaration-site variance (`out`/`in` on the class) is Kotlin's answer to Java's use-site wildcards (`? extends` / `? super`). Remember it as producer = `out`, consumer = `in`. A star projection is the safe choice when you don't care about the element type, for example `fun count(xs: List<*>)`."

      - type: single
        prompt: "Why must a function with a `reified` type parameter be declared `inline`?"
        code:
          source: |
            inline fun <reified T> Any?.isA(): Boolean = this is T
        options:
          - { id: a, text: "The body is copied into each call site, where the real type argument is known and `is T` can be checked" }
          - { id: b, text: "`reified` makes the JVM keep generic type arguments at runtime for each class that declares them" }
          - { id: c, text: "A non-inline generic function has no way to use `is`, because the compiler forbids type checks inside generics" }
          - { id: d, text: "`reified` type arguments are passed as extra hidden `Class<T>` parameters that only inline functions can read" }
        answer: a
        explanation: "On the JVM, type arguments of a normal generic function are erased, so `this is T` cannot be checked (checks like `is String` on a value are fine). Because an inline function's body is substituted at the call site, the compiler can replace `T` with the concrete type there; no hidden class token is passed and the JVM keeps nothing extra. That is also why a reified function can't be called with a type argument that is itself a non-reified type parameter."

      - type: multi
        prompt: Select all true statements about `inline` functions.
        options:
          - { id: a, text: "A lambda passed to an inline function can `return` from the calling function (a non-local return)" }
          - { id: b, text: "`noinline` keeps a lambda parameter as a real object, e.g. when you store it" }
          - { id: c, text: "`crossinline` forbids non-local `return`, which lets the lambda run from another context" }
          - { id: d, text: "`reified` can be put on a class's type parameter, as in `class Box<reified T>`" }
          - { id: e, text: "Marking a function `inline` always makes the program faster: no call, no stack frame" }
        answers: [a, b, c]
        explanation: "Inlining removes the lambda allocation and call, but it duplicates the body at every call site (code bloat), so it is a trade-off, not a free win; it pays off mostly for small functions that take lambdas. `reified` works only on type parameters of inline functions (and inline property accessors), never on classes."

      - type: single
        prompt: What does this print?
        code:
          source: |
            interface Greeter {
                fun name(): String
                fun greet(): String
            }

            class Base : Greeter {
                override fun name() = "base"
                override fun greet() = "hello " + name()
            }

            class Loud(g: Greeter) : Greeter by g {
                override fun name() = "loud"
            }

            fun main() = println(Loud(Base()).greet())
        options:
          - { id: a, text: "hello base" }
          - { id: b, text: "hello loud" }
          - { id: c, text: "It does not compile: `Loud` must also override `greet()`" }
          - { id: d, text: "It overflows the stack, because `name()` calls itself through the delegate" }
        answer: a
        explanation: "Class delegation forwards the non-overridden members (`greet`) to the wrapped object, and inside `Base.greet()` the call `name()` is `this.name()` on the `Base` instance, which knows nothing about `Loud`. Delegation is not inheritance: there is no virtual dispatch back into the wrapper. With inheritance (an `open` Base whose `open fun name()` is overridden in a subclass) the answer would be \"hello loud\"."

      - type: fill
        prompt: Complete a small type-safe builder DSL, where nested blocks cannot silently call the outer builder.
        template: |
          @[[1]]
          annotation class HtmlDsl

          @HtmlDsl
          class Row { fun cell(text: String) { /* ... */ } }

          @HtmlDsl
          class Table {
              val rows = mutableListOf<Row>()
              fun row(init: Row.() -> Unit) { rows += Row().apply(init) }
          }

          fun table(init: [[2]].() -> Unit): Table = Table().[[3]](init)
        bank: ["DslMarker", "Table", "apply", "Row", "let", "Deprecated"]
        answers: ["DslMarker", "Table", "apply"]
        explanation: "`@DslMarker` is a meta-annotation. Once your annotation carries it and is applied to the builder classes, a nested lambda can no longer call members of an outer builder implicitly. `init` must be a lambda with a `Table` receiver so the block can call `row { }` directly, and `apply` runs the block on the new builder and returns the builder itself (`let` would return the lambda's result, here `Unit`)."

      - type: single
        prompt: "Which problem does this code have in a coroutine-based service?"
        code:
          source: |
            suspend fun loadUser(id: Long): User? =
                runCatching { api.fetchUser(id) }   // fetchUser is a suspend function
                    .getOrNull()
        options:
          - { id: a, text: "`runCatching` also catches CancellationException, which swallows cancellation and turns errors into null" }
          - { id: b, text: "`runCatching` is not inline; a suspend call inside its lambda does not compile" }
          - { id: c, text: "`getOrNull` parks the calling thread until the `Result` is ready, which defeats the point of a suspend function" }
          - { id: d, text: "Kotlin forbids `Result` as the return type of a `suspend` function and accepts it only as a parameter" }
        answer: a
        explanation: "`runCatching` is `try { Result.success(block()) } catch (e: Throwable) { Result.failure(e) }`; since the lambda is inline it may call suspend functions, but it also catches the CancellationException that a cancelled coroutine uses to unwind. Catch specific exceptions, or rethrow cancellation (`.onFailure { if (it is CancellationException) throw it }`), and model expected failures explicitly (a sealed result type) instead of collapsing them all into null. `getOrNull` just unwraps the already-computed `Result` (it never blocks), and `Result` is a legal return type since Kotlin 1.5."

      - type: single
        prompt: "With a current Kotlin compiler (1.7 or newer), what happens to this code?"
        code:
          source: |
            sealed interface Cmd
            data class Add(val n: Int) : Cmd
            data class Remove(val n: Int) : Cmd
            object Clear : Cmd

            fun handle(c: Cmd) {
                when (c) {
                    is Add -> println("add ${c.n}")
                    is Remove -> println("remove ${c.n}")
                }
            }
        options:
          - { id: a, text: "Compile error: a `when` on a sealed subject must be exhaustive, even as a statement" }
          - { id: b, text: "It compiles: a `when` statement does not need to cover each case, so `Clear` is ignored" }
          - { id: c, text: "It compiles with a warning only; at runtime `Clear` falls through to a `NoWhenBranchMatchedException`" }
          - { id: d, text: "It compiles if `Clear` becomes a `data class`, because objects cannot be matched with `is`" }
        answer: a
        explanation: "Since Kotlin 1.7, non-exhaustive `when` statements over sealed, enum and Boolean subjects are errors rather than warnings. That is what makes sealed hierarchies a safety net: adding `Clear` breaks every handler that forgot it. Adding an `else` branch silences the compiler and throws that safety away, so avoid `else` on sealed `when`s."

      - type: open
        prompt: "Explain how a type-safe builder DSL (like `html { body { p { +\"hi\" } } }` or Gradle's Kotlin DSL) works in Kotlin, and what `@DslMarker` is for."
        modelAnswer: "A builder DSL is built from higher-order functions whose last parameter is a lambda with receiver, such as `fun table(init: Table.() -> Unit): Table`. Inside the lambda `this` is the builder, so you call its members without qualification; the function creates the builder, runs the block on it (typically with `apply`) and returns the result, and nested blocks create nested builders. The catch is scope leakage: in a nested lambda the outer receivers are still implicitly available, so you could call `row` inside `row` by mistake and it would silently resolve to the outer builder. Annotating the builder classes with an annotation marked `@DslMarker` makes such implicit access to an outer receiver a compile error (you can still write `this@table` explicitly). Keep the DSL small and let the builders produce immutable results; the cost is harder debugging and weaker tooling than plain constructors."
        keyPoints:
          - point: "Lambda with receiver (`T.() -> Unit`): the block runs with the builder as `this`; the builder function creates it, applies the block and returns it"
            keywords: ["lambda with receiver", "receiver", "apply"]
          - point: "`@DslMarker` turns implicit access to an outer receiver from a nested lambda into a compile error"
            keywords: ["dslmarker", "outer receiver", "scope leak"]
          - point: "Design guidance: small surface, immutable results; costs are harder debugging and tooling"
            keywords: ["immutable", "debug", "tooling", "small"]
        followUps:
          - when: missed
            point: 2
            prompt: "Without `@DslMarker`, what goes wrong in `table { row { row { cell(\"x\") } } }`, and how does the annotation change it?"
            modelAnswer: "Without the marker, the innermost lambda has two receivers in scope, the Row and the outer Table, and `row` is not a member of Row, so the call silently resolves to the outer Table. The row ends up as a sibling in the table instead of inside the first row, and the compiler says nothing. With `@DslMarker` on both classes, the compiler rejects implicit calls to a member of an outer receiver from inside the nested lambda. If you really want the outer builder you must say so explicitly, for example `this@table.row { }`."
            keyPoints:
              - point: "Both receivers are in scope, so the call silently resolves to the outer builder"
                keywords: ["outer", "both receivers", "silently"]
              - point: "With the marker, the implicit call to the outer receiver is a compile error"
                keywords: ["compile error", "rejects", "error"]
              - point: "An explicit label such as this@table is still allowed"
                keywords: ["this@", "explicit", "label"]
          - when: covered
            point: 1
            prompt: "What is the difference for the caller between a parameter of type `Row.() -> Unit` and one of type `(Row) -> Unit`?"
            modelAnswer: "With `Row.() -> Unit` the lambda body sees the row as `this`, so members are called unqualified, like `cell(\"x\")`. With `(Row) -> Unit` the body receives the row as a parameter, by default called `it`, and has to qualify every call, like `it.cell(\"x\")`. Under the hood both are the same kind of function object that takes the row as its first parameter; the receiver form is simply nicer syntax for builders."
            keyPoints:
              - point: "Receiver form: members are called unqualified through this"
                keywords: ["this", "unqualified", "without qualif"]
              - point: "Parameter form needs it or a named parameter"
                keywords: ["it.", "parameter", "named"]
