id: coroutines
title: Coroutines & Concurrency
icon: workflow
description: Structured concurrency, dispatchers, Flow and the failure modes interviewers love.
lessons:
  - id: coroutines-basics
    title: Structured concurrency
    questions:
      - type: single
        hint: "One is for fire-and-forget work; the other lets you wait for a value later."
        prompt: What do `launch` and `async` return?
        options:
          - { id: a, text: "`launch` returns a Job; `async` returns a Deferred<T>" }
          - { id: b, text: "Both return Deferred<T>" }
          - { id: c, text: "`launch` returns Unit; `async` returns a plain T" }
          - { id: d, text: "`launch` returns a Deferred<Unit>; `async` returns a Job" }
        answer: a
        explanation: "`launch` is fire-and-forget work with a Job handle for cancellation and joining. `async` returns a Deferred, a Job that also carries a result you read with `await()`."

      - type: single
        prompt: In what order is output printed?
        code:
          source: |
            fun main() = runBlocking {
                launch { delay(100); println("A") }
                println("B")
                coroutineScope {
                    launch { delay(50); println("C") }
                }
                println("D")
            }
        options:
          - { id: a, text: "B, C, D, A" }
          - { id: b, text: "B, D, C, A" }
          - { id: c, text: "A, B, C, D" }
          - { id: d, text: "B, A, C, D" }
        answer: a
        explanation: "`launch` doesn't run the block immediately on the same single-threaded event loop, so B prints first. `coroutineScope` suspends until its children finish (C at 50 ms), then D prints. A is a child of the outer runBlocking and fires at 100 ms."

      - type: multi
        hint: "Think about parent and child: what happens to children when the parent is cancelled, and to the parent when a child fails?"
        prompt: Select all guarantees of structured concurrency.
        options:
          - { id: a, text: "A parent does not complete until all its children complete" }
          - { id: b, text: "Cancelling a parent cancels its children" }
          - { id: c, text: "In a regular scope, an unhandled failure in a child cancels its siblings and propagates to the parent" }
          - { id: d, text: "`GlobalScope.launch` is tied to the lifecycle of the calling function" }
          - { id: e, text: "Children may outlive their scope if they run on a different dispatcher (say, `Dispatchers.IO`)" }
        answers: [a, b, c]
        explanation: "The dispatcher has nothing to do with lifetime: the scope owns the child. `GlobalScope` is explicitly the opposite, an unscoped coroutine that lives until the process ends or it finishes."

      - type: single
        hint: "Blocking calls need a pool sized for waiting, not for CPU cores."
        prompt: Which dispatcher is the right default for a blocking JDBC call inside a coroutine?
        options:
          - { id: a, text: "Dispatchers.IO" }
          - { id: b, text: "Dispatchers.Default" }
          - { id: c, text: "Dispatchers.Unconfined" }
          - { id: d, text: "Dispatchers.Main" }
        answer: a
        explanation: "`Dispatchers.Default` is sized to CPU cores and is for CPU-bound work: blocking it starves other coroutines. `Dispatchers.IO` uses an elastic pool (64 threads by default) made for blocking calls."

      - type: single
        hint: "What else does `catch (e: Exception)` catch, and how is cancellation signalled inside a coroutine?"
        prompt: What is wrong with this code?
        code:
          source: |
            suspend fun fetch() {
                try {
                    delay(1000)
                    api.call()
                } catch (e: Exception) {
                    log.warn("failed", e)
                }
            }
        options:
          - { id: a, text: "It swallows CancellationException, which means cancelling the coroutine does not stop it" }
          - { id: b, text: "`delay` cannot be used inside a try block; the compiler rejects suspension points there" }
          - { id: c, text: "A suspend function is unable to catch exceptions from another suspend function" }
          - { id: d, text: "`log.warn` is not allowed inside a `catch` block of a suspend function" }
        answer: a
        explanation: "Cancellation is delivered as a CancellationException at a suspension point. Catching `Exception` (or `Throwable`) swallows it. Rethrow it (`if (e is CancellationException) throw e`) or catch more specific types."

      - type: fill
        hint: "You need a scope that waits for its children, and a way to start work without waiting for it yet."
        prompt: Load a user and their orders concurrently.
        template: |
          suspend fun loadScreen(): Pair<User, List<Order>> = [[1]] {
              val user = [[2]] { api.user() }
              val orders = [[3]] { api.orders() }
              user.[[4]]() to orders.await()
          }
        bank: ["coroutineScope", "async", "async", "await", "launch", "runBlocking"]
        answers: ["coroutineScope", "async", "async", "await"]
        explanation: "`coroutineScope` makes the two `async` calls children of the current coroutine (failure cancels both) and returns when both are done. Total latency becomes max(user, orders) instead of the sum. `runBlocking` would block the calling thread."

      - type: spot
        hint: "Look for a call that parks the thread rather than suspending the coroutine."
        prompt: This coroutine blocks its thread and defeats the concurrency. Tap the offending line.
        source: |
          suspend fun refresh(): Pair<List<User>, List<Order>> = coroutineScope {
              val users = async { api.users() }
              val orders = async { api.orders() }
              Thread.sleep(500)
              users.await() to orders.await()
          }
        answers: [4]
        explanation: "`Thread.sleep` blocks the thread the coroutine runs on, so every other coroutine on that dispatcher thread stalls too. `delay(500)` suspends instead and frees the thread. The same applies to blocking JDBC or file calls: move them to `withContext(Dispatchers.IO)`."

      - type: match
        prompt: Match each dispatcher to its job.
        pairs:
          - { left: "`Dispatchers.Default`", right: "CPU-bound work, sized to the core count" }
          - { left: "`Dispatchers.IO`", right: "Blocking calls such as JDBC or file I/O" }
          - { left: "`Dispatchers.Main`", right: "The UI thread in Android and desktop apps" }
          - { left: "`Dispatchers.Unconfined`", right: "Starts in the caller's thread; rarely what you want" }
        explanation: "Default and IO share one thread pool but have separate limits, so blocking on IO doesn't starve CPU work. Unconfined is mostly for tests and special cases because the resumption thread is unpredictable."

      - type: open
        hint: "Think about lifetime: who cancels it, and who ever sees its exceptions?"
        prompt: Why is `GlobalScope.launch` discouraged, and what would you use inside a Spring service instead?
        modelAnswer: "GlobalScope coroutines are not tied to any lifecycle: they can't be cancelled with the component, they leak if they hang, and their exceptions don't propagate to a caller. Prefer suspend functions with `coroutineScope`/`supervisorScope` so work is bound to the caller, or, for background work owned by a bean, a dedicated CoroutineScope (SupervisorJob + an injected dispatcher) that is cancelled in @PreDestroy. Injecting the dispatcher also makes the code testable."
        keyPoints:
          - point: "No lifecycle/structured concurrency: coroutines leak, can't be cancelled, errors are lost"
            keywords: ["lifecycle", "leak", "cancel", "structured", "unscoped", "lost", "orphan"]
          - point: "Use coroutineScope/supervisorScope inside suspend functions so work belongs to the caller"
            keywords: ["coroutineScope", "supervisorScope", "suspend fun", "caller", "parent"]
          - point: "For bean-owned background work, a dedicated scope cancelled on shutdown (e.g. @PreDestroy), ideally with an injected dispatcher"
            keywords: ["predestroy", "own scope", "dedicated scope", "supervisorjob", "injected dispatcher", "inject", "shutdown", "close"]
        followUps:
          - when: missed
            point: 3
            prompt: "How would you give a Spring bean its own coroutine scope, and make sure its work stops on shutdown?"
            modelAnswer: "Create the scope as a field: `CoroutineScope(SupervisorJob() + dispatcher)`, with the dispatcher injected so tests can replace it. Cancel it when the bean is destroyed, via `@PreDestroy` or `DisposableBean`, so running coroutines get a CancellationException instead of being killed with the JVM. SupervisorJob makes sure one failing child doesn't cancel its siblings, and a CoroutineExceptionHandler makes sure failures are logged rather than lost."
            keyPoints:
              - point: "Own scope built from a SupervisorJob and an injected dispatcher"
                keywords: ["supervisorjob", "injected", "dispatcher"]
              - point: "Cancel it when the bean is destroyed (@PreDestroy / DisposableBean)"
                keywords: ["predestroy", "disposablebean", "cancel", "destroy"]
              - point: "Handle child failures (exception handler, logging) so they are not silently lost"
                keywords: ["exceptionhandler", "exception handler", "log", "handler"]
          - when: covered
            point: 2
            prompt: "When would you choose `supervisorScope` over `coroutineScope`?"
            modelAnswer: "Use `coroutineScope` when the children form one unit of work: one failure should cancel the rest and fail the caller. Use `supervisorScope` when the children are independent, for example loading optional widgets or notifying several subscribers, and a failure of one should not cancel its siblings. You then handle each child's failure yourself, with a try/catch inside it or a CoroutineExceptionHandler."
            keyPoints:
              - point: "coroutineScope: one failure cancels the siblings and fails the caller (one unit of work)"
                keywords: ["cancel", "one failure", "unit of work", "fails"]
              - point: "supervisorScope: independent children whose failures don't cancel siblings"
                keywords: ["independent", "siblings", "supervisor"]
              - point: "With supervisorScope you handle each child's failure yourself"
                keywords: ["try/catch", "handler", "handle"]

  - id: coroutines-flow
    title: Flow & failure handling
    questions:
      - type: single
        hint: "Compare it with a sequence: does merely declaring it do any work?"
        prompt: "`flow { emit(1) }` is declared but nobody collects it. When does the lambda run?"
        options:
          - { id: a, text: "Each time it is collected, and not before: Flow is cold" }
          - { id: b, text: "Eagerly, at the point of declaration" }
          - { id: c, text: "Once, on the first collection, which caches the result for later collectors" }
          - { id: d, text: "On the next tick of the event loop: the declaring function returns first" }
        answer: a
        explanation: "A cold flow runs its producer block per collector. Use `shareIn`/`stateIn` to turn it into a hot flow shared among collectors."

      - type: single
        hint: "Of the shared flows, which one always has a current value for a late collector?"
        prompt: "You need to expose \"the latest UI state\" that new collectors immediately receive, and that skips equal consecutive values. Which type fits best?"
        options:
          - { id: a, text: "StateFlow" }
          - { id: b, text: "SharedFlow with replay = 0" }
          - { id: c, text: "A cold `flow {}`" }
          - { id: d, text: "Channel" }
        answer: a
        explanation: "StateFlow always holds a value, replays the latest to new collectors, and conflates equal values. A SharedFlow is for events with configurable replay; a Channel delivers each element to a single consumer."

      - type: single
        prompt: What happens here?
        code:
          source: |
            supervisorScope {
                launch { error("boom") }
                launch {
                    delay(100)
                    println("sibling done")
                }
            }
        options:
          - { id: a, text: "\"sibling done\" is printed, because a failing child of a supervisor does not cancel its siblings" }
          - { id: b, text: "Nothing is printed; the failing child cancels its sibling, just like in `coroutineScope`" }
          - { id: c, text: "The exception is rethrown by `supervisorScope` after the sibling finishes" }
          - { id: d, text: "It deadlocks: `supervisorScope` waits forever for a child that already failed" }
        answer: a
        explanation: "A supervisor's children fail independently. The uncaught exception from a `launch` child goes to the CoroutineExceptionHandler (or the thread's handler); it neither cancels siblings nor is rethrown by the scope. With `coroutineScope`, the sibling would be cancelled and the exception rethrown."

      - type: multi
        prompt: Select all true statements about Flow.
        options:
          - { id: a, text: "By default, collection happens in the context of the collector (context preservation)" }
          - { id: b, text: "`flowOn` changes the context of the operators above it (upstream)" }
          - { id: c, text: "Calling `withContext` around `emit` inside `flow {}` is the supported way to switch dispatcher" }
          - { id: d, text: "`buffer()` runs the producer in a separate coroutine so it and the collector can overlap" }
          - { id: e, text: "A Flow instance can be collected only once (like an `Iterator`)" }
        answers: [a, b, d]
        explanation: "Flow has context preservation: emitting from another context inside `flow {}` throws. Use `flowOn` (or `channelFlow`). Cold flows can be collected any number of times."

      - type: order
        prompt: Arrange the lines of a Flow that emits a counter every second, forever.
        lines:
          - "fun ticker(): Flow<Int> = flow {"
          - "    var i = 0"
          - "    while (true) {"
          - "        emit(i++)"
          - "        delay(1000)"
          - "    }"
          - "}"
        explanation: "State before the loop, `emit` then `delay` inside it. The loop is infinite but cooperative: `emit` and `delay` are cancellation points, so cancelling the collector stops it."

      - type: single
        prompt: Which call returns `null` instead of throwing when the block exceeds its time limit?
        options:
          - { id: a, text: "withTimeoutOrNull" }
          - { id: b, text: "withTimeout" }
          - { id: c, text: "supervisorScope" }
          - { id: d, text: "awaitCancellation" }
        answer: a
        explanation: "`withTimeout` throws TimeoutCancellationException (a CancellationException subclass, so careful with broad catches). `withTimeoutOrNull` returns null. `supervisorScope` and `awaitCancellation` have no time limit at all."

      - type: open
        hint: "Which of the three calls depend on each other, and in which scope would you start the independent ones?"
        prompt: "A Spring Boot endpoint calls three downstream REST APIs one after the other, 200 ms each. How would you cut the latency with coroutines, and what do you watch out for?"
        modelAnswer: "Run the independent calls concurrently with `async` inside a `coroutineScope`, so latency is roughly the slowest call (~200 ms) instead of 600 ms. Use a non-blocking client (WebClient) or Dispatchers.IO for blocking clients. Decide failure semantics: in a plain coroutineScope one failure cancels the siblings; use supervisorScope or per-call error handling if partial results are acceptable. Add timeouts (withTimeout) and limit concurrency (e.g. a Semaphore) so you don't flood downstreams."
        keyPoints:
          - point: "Run independent calls concurrently with async/await in a coroutineScope; latency ~ max, not sum"
            keywords: ["async", "concurrent", "parallel", "coroutinescope", "max", "slowest"]
          - point: "Use a non-blocking client or an appropriate dispatcher (IO) so you don't block threads"
            keywords: ["webclient", "non-blocking", "nonblocking", "dispatchers.io", "dispatcher", "blocking"]
          - point: "Define failure behaviour: sibling cancellation vs supervisorScope/partial results"
            keywords: ["supervisorscope", "partial", "failure", "cancel", "fallback", "error handling"]
          - point: "Add timeouts and bound concurrency to protect downstream services"
            keywords: ["timeout", "semaphore", "limit", "bound", "rate", "backpressure"]

  - id: coroutines-advanced
    title: Flow operators & cancellation
    questions:
      - type: match
        prompt: Match each Flow operator to its behaviour.
        pairs:
          - { left: "`flatMapConcat`", right: "Collects the inner flows one after another, preserving order" }
          - { left: "`flatMapMerge`", right: "Collects inner flows concurrently, so items interleave as they arrive" }
          - { left: "`flatMapLatest`", right: "Cancels the previous inner flow as soon as a new upstream value arrives" }
          - { left: "`conflate()`", right: "Drops intermediate values so a slow collector only sees the most recent one" }
          - { left: "`buffer()`", right: "Runs the producer in its own coroutine, connected by a channel, so producer and collector overlap" }
        explanation: "The three `flatMap` variants differ only in how they treat overlapping inner flows: queue them, run them together, or cancel the stale one. `flatMapLatest` is the search-as-you-type operator. `buffer` and `conflate` are about speed mismatch between producer and collector: buffer keeps everything (up to its capacity), conflate keeps only the latest."

      - type: estimate
        prompt: "Ignoring overhead, how long does this take in total? (Without `buffer()` it would take 1,200 ms.)"
        code:
          source: |
            flow {
                for (i in 1..3) {
                    delay(100)   // producer: 100 ms per item
                    emit(i)
                }
            }
                .buffer()
                .collect { delay(300) }   // collector: 300 ms per item
        answer: 1000
        tolerance: 0.05
        unit: ms
        explanation: "The producer emits at 100, 200 and 300 ms into the buffer without waiting for the collector. The collector starts the first item at 100 ms and then works through the three items back to back: 100 + 3 x 300 = 1,000 ms. Unbuffered, producer and collector alternate: 3 x (100 + 300) = 1,200 ms. Buffering overlaps the two, but the slower side (the collector) still sets the pace."

      - type: fill
        prompt: "Search-as-you-type: wait for a pause in typing, cancel a search that a newer query makes obsolete, and expose the latest result as state."
        template: |
          val results: StateFlow<List<Hit>> = query
              .debounce(300)
              .[[1]] { q -> repo.search(q) }
              .[[2]](viewModelScope, SharingStarted.WhileSubscribed(5_000), emptyList())
        bank: ["flatMapLatest", "flatMapConcat", "stateIn", "shareIn", "collect", "conflate"]
        answers: ["flatMapLatest", "stateIn"]
        explanation: "`flatMapLatest` cancels the running search when a new query arrives, whereas `flatMapConcat` would queue the stale searches. `stateIn` turns the cold flow into a hot `StateFlow` with an initial value; `WhileSubscribed(5_000)` keeps the upstream alive for 5 seconds after the last collector leaves, so a quick re-subscription (for example a screen rotation) does not restart it. `shareIn` would give a `SharedFlow` and needs a replay count instead of an initial value."

      - type: multi
        prompt: Select all true statements about Channels and Flows.
        options:
          - { id: a, text: "Each element sent to a Channel is received by exactly one receiver, which lets several consumers share the work" }
          - { id: b, text: "A cold Flow runs its producer block again for every collector" }
          - { id: c, text: "A consumer looping with `for (x in channel)` waits on an empty channel and ends normally only once the channel is closed" }
          - { id: d, text: "`Channel<T>()` created with no arguments buffers 64 elements by default" }
          - { id: e, text: "Collecting a `StateFlow` ends when its producer stops updating it" }
        answers: [a, b, c]
        explanation: "A channel is a hot hand-off between coroutines, so it needs an explicit `close()` to signal completion. The default capacity of `Channel()` is rendezvous (0): `send` suspends until a receiver is there; `Channel.BUFFERED` (64 by default) is opt-in. A `StateFlow` never completes: collection only ends when the collector is cancelled."

      - type: multi
        prompt: "This CPU-bound loop ignores `cancel()`. Select all changes that make it respond to cancellation."
        code:
          source: |
            suspend fun crunch(items: List<Item>) = withContext(Dispatchers.Default) {
                for (item in items) {
                    heavyCpuWork(item)   // plain function, no suspension points
                }
            }
        options:
          - { id: a, text: "Call `ensureActive()` at the top of each iteration" }
          - { id: b, text: "Check `isActive` on each iteration and stop when it is false" }
          - { id: c, text: "Call `yield()` on each iteration" }
          - { id: d, text: "Wrap the loop body in `try { ... } catch (e: CancellationException) { }`" }
          - { id: e, text: "Run it on `Dispatchers.IO` instead of `Dispatchers.Default`" }
        answers: [a, b, c]
        explanation: "Cancellation is cooperative: a coroutine only notices it at a suspension point or when it checks. A loop with no suspension points runs to completion even after `cancel()`. `ensureActive()` throws if the job was cancelled, `isActive` lets you exit manually, and `yield()` is a suspension point that also checks for cancellation. Catching the exception only hides it, and the dispatcher has no influence on cooperation."

      - type: single
        prompt: "A test written with `runTest` takes a real 10 seconds, although the code under test only calls `delay(10_000)`. What is the most likely cause?"
        options:
          - { id: a, text: "The code runs on a hard-coded dispatcher such as `Dispatchers.IO`, so its `delay` uses real time instead of virtual time" }
          - { id: b, text: "`runTest` skips delays in the test body itself, but not in code started with `launch` and `async`" }
          - { id: c, text: "Virtual time only works for delays shorter than a few seconds, since longer ones fall back to real time" }
          - { id: d, text: "`delay` is only skipped after an explicit `advanceUntilIdle()` call, so without it `runTest` waits in real time" }
        answer: a
        explanation: "`runTest` runs the test body on a `TestScheduler` that advances virtual time whenever all coroutines are idle, so `delay(10_000)` costs nothing. A dispatcher the code creates or hard-codes bypasses that scheduler. Inject the `CoroutineDispatcher` (production: `Dispatchers.IO`; test: `StandardTestDispatcher(testScheduler)`) so the test controls time."

      - type: single
        prompt: What happens when `load()` is called?
        code:
          source: |
            suspend fun load(): Int = coroutineScope {
                val a = async { error("boom") }
                try {
                    a.await()
                } catch (e: IllegalStateException) {
                    println("caught")
                }
                42
            }
        options:
          - { id: a, text: "It prints \"caught\", then `load()` throws the IllegalStateException" }
          - { id: b, text: "It prints \"caught\" and returns 42, because the catch handles the failure" }
          - { id: c, text: "It prints \"caught\" and then suspends forever: it keeps waiting for the failed child" }
          - { id: d, text: "It returns 42, and the exception goes to the default exception handler" }
        answer: a
        explanation: "A failing `async` child cancels its parent scope as soon as it fails, whether or not anyone awaits it. The `try/catch` handles the exception at `await()` but cannot undo that cancellation, so `coroutineScope` rethrows the child's failure when it completes. Fix: use `supervisorScope { }` and handle each `await()` yourself, or catch inside the `async` block and return a result type."

      - type: spot
        prompt: "This loop is meant to run `handle` for all items inside the scope. Tap the line that breaks structured concurrency."
        source: |
          suspend fun processAll(items: List<Item>) = coroutineScope {
              for (item in items) {
                  launch(SupervisorJob()) {
                      handle(item)
                  }
              }
          }
        answers: [3]
        explanation: "A `Job` passed to a coroutine builder becomes the parent of the new coroutine, replacing the scope's own job. The launched coroutines are no longer children of `coroutineScope`: it returns without waiting for them, cancelling the scope does not cancel them, and their failures do not reach the caller. To get 'siblings fail independently' use `supervisorScope { launch { } }` instead of passing a job."

      - type: open
        prompt: "A service consumes events from a stream as a `Flow` and enriches each one with a 50 ms remote call. It falls behind. How do you raise throughput without losing control of memory or ordering?"
        modelAnswer: "By default a Flow is sequential: each element finishes the whole pipeline before the next starts, so a 50 ms call caps one collector at roughly 20 events per second. To go faster, process several elements at once, for example with `flatMapMerge(concurrency = N)` or by launching the calls from a `channelFlow` with a limited number of workers, and use `buffer()` so the producer is not blocked while the collector is busy. Keep everything bounded: choose a buffer capacity and an overflow policy (suspend for backpressure, or drop if losing items is acceptable) instead of letting a queue grow without limit, and cap concurrency so the downstream service is not flooded. Concurrency changes ordering: `flatMapMerge` emits results as they finish, so if order matters you must partition by key, or start each call as a `Deferred`, buffer them and await them in order. Finally handle errors with retries and backoff, and make the processing idempotent, because failures and restarts cause redelivery."
        keyPoints:
          - point: "Flow is sequential by default, so latency caps throughput; add bounded concurrency (flatMapMerge with a limit, channelFlow with workers)"
            keywords: ["sequential", "flatMapMerge", "channelFlow", "concurren"]
          - point: "Decouple producer and collector with buffer(), but keep it bounded: capacity and overflow policy give backpressure"
            keywords: ["buffer", "bounded", "overflow", "backpressure"]
          - point: "Concurrency affects ordering: partition by key or await results in order when order matters"
            keywords: ["ordering", "partition", "deferred"]
          - point: "Handle failures: retries with backoff, idempotent processing"
            keywords: ["retries", "idempoten", "backoff", "dead-letter"]
        followUps:
          - when: missed
            point: 2
            prompt: "What overflow strategies does a buffered flow or channel offer, and when is dropping acceptable?"
            modelAnswer: "`BufferOverflow.SUSPEND` is the default: the producer suspends when the buffer is full, which is real backpressure and loses nothing. `DROP_OLDEST` and `DROP_LATEST` never suspend the producer but discard items, and `conflate()` is a buffer of size one that keeps only the latest value. Dropping is acceptable when only the newest state matters, such as UI state or a sensor reading, and wrong for events that must all be processed, such as payments."
            keyPoints:
              - point: "SUSPEND is the default and gives backpressure without losing items"
                keywords: ["suspend", "backpressure"]
              - point: "DROP_OLDEST, DROP_LATEST and conflate discard items"
                keywords: ["drop_oldest", "drop_latest", "conflate", "discard"]
              - point: "Dropping is acceptable only when the latest state is what matters"
                keywords: ["latest", "newest", "state"]
          - when: covered
            point: 3
            prompt: "How could you run the enrichment 8 at a time but still emit the results in the original order?"
            modelAnswer: "Start each call as a `Deferred` with `async`, inside a scope that outlives the pipeline, send the deferreds through `buffer(8)` so roughly eight calls are running while the collector waits on the oldest, and `await()` them one by one in the next `map`. The awaiting is sequential, so the order is preserved, while the work itself overlaps. `flatMapMerge` would deliver faster but unordered."
            keyPoints:
              - point: "Start each call as a Deferred (async)"
                keywords: ["async", "deferred"]
              - point: "buffer(8) keeps roughly eight in flight"
                keywords: ["buffer"]
              - point: "await them in order, so ordering is preserved"
                keywords: ["await", "in order", "preserved"]
