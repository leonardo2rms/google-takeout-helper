id: messaging
title: Messaging & Events
icon: mail
description: Kafka partitions, consumer groups and offsets, delivery guarantees, retries and dead letters, plus events, outbox, inbox and sagas.
lessons:
  - id: msg-kafka
    title: Kafka fundamentals
    questions:
      - type: estimate
        prompt: "A topic must absorb 120 MB/s. Measurements: one partition accepts about 10 MB/s from producers, and one consumer can process about 6 MB/s of a partition's data. What is the minimum number of partitions that keeps both sides up (ignore headroom)?"
        answer: 20
        tolerance: 0
        unit: partitions
        explanation: "Take the larger of the two requirements: the producers need 120 / 10 = 12 partitions, the consumers need 120 / 6 = 20 (a partition is read by at most one consumer in a group, so the slow consumer side sets the limit). In practice add headroom and remember that partitions can be added later but not removed, and adding them changes which partition a key maps to."

      - type: single
        prompt: "What ordering does Kafka guarantee?"
        options:
          - { id: a, text: "Records within one partition are ordered, and equal keys go to the same partition, so order holds per key" }
          - { id: b, text: "All records of a topic are globally ordered, because the broker assigns each record a topic-wide sequence number" }
          - { id: c, text: "Records are ordered across all partitions, but only for the consumers inside one consumer group" }
          - { id: d, text: "Ordering is guaranteed only when the topic has exactly one broker, because replicas can reorder records" }
        answer: a
        explanation: "The partition is the unit of ordering and of parallelism (and keys map to the same partition only while the partition count stays the same). A global order would force a single partition and a single reader; offsets are per partition, and the number of brokers or consumer groups does not change that. So choose a key that carries the ordering you need (for example the order id) and expect no ordering between different keys."
        difficulty: easy

      - type: code
        prompt: "Write `partitionFor(key, numPartitions)` so that the same key always lands in the same partition. Hash the key with the classic 31-multiplier string hash (`h = h * 31 + charCode`, kept in signed 32-bit arithmetic), clear the sign bit with `h & 0x7fffffff`, then take the remainder modulo `numPartitions`."
        starter: |
          function partitionFor(key, numPartitions) {
            // your code
            return 0;
          }
        entry: partitionFor
        tests:
          - { args: ["order-42", 6], expect: 3 }
          - { args: ["order-43", 6], expect: 4 }
          - { args: ["a", 4], expect: 1 }
          - { args: ["order-42", 12], expect: 9 }
          - { args: ["zebra", 16], expect: 6, hidden: true }
          - { args: ["customer-7", 7], expect: 3, hidden: true }
          - { args: ["invoice-9", 5], expect: 3, hidden: true }
          - { args: ["polygenelubricants", 7], expect: 0, hidden: true }
        solution: |
          function partitionFor(key, numPartitions) {
            let h = 0;
            for (let i = 0; i < key.length; i++) {
              h = (Math.imul(h, 31) + key.charCodeAt(i)) | 0;
            }
            return (h & 0x7fffffff) % numPartitions;
          }
        kotlin: |
          fun partitionFor(key: String, numPartitions: Int): Int =
              (key.hashCode() and 0x7fffffff) % numPartitions
        explanation: "Two classic traps: the hash is often negative, and in most languages a negative number gives a negative remainder, so you must make it non-negative first. Masking the sign bit is safe; `abs(hash) % n` is not, because `abs(Int.MIN_VALUE)` is still negative on the JVM (the hidden test uses a string whose hash is exactly Int.MIN_VALUE). Kafka's default partitioner uses murmur2 rather than this hash, and it also changes behaviour for keyless records, but the principle (deterministic hash, made positive, modulo partition count) is the same."

      - type: single
        prompt: "One consumer keeps dropping out of its group under load and records get processed twice. What does this log show, and what do you do?"
        code:
          lang: text
          source: |
            WARN  [Consumer clientId=billing-3, groupId=billing] Leaving the group: time between two poll() calls (412 s) exceeded max.poll.interval.ms (300000 ms)
            INFO  [Consumer clientId=billing-3, groupId=billing] Revoking previously assigned partitions [payments-4]
            ERROR [Consumer clientId=billing-3, groupId=billing] Offset commit failed: the group has already rebalanced and the partitions belong to another member
        options:
          - { id: a, text: "Processing a batch took longer than max.poll.interval.ms, so the member was removed; reduce max.poll.records or speed up the work" }
          - { id: b, text: "The broker ran out of disk space and dropped the consumer, so free disk space and restart the broker" }
          - { id: c, text: "The topic has too many partitions for one group, so delete partitions to stop the rebalances" }
          - { id: d, text: "Heartbeats were lost on the network, so the only fix is to raise session.timeout.ms and heartbeat.interval.ms" }
        answer: a
        explanation: "The log names the cause: 412 s between poll() calls against a 300 s limit. The consumer was declared failed, a rebalance gave payments-4 to someone else, and its late offset commit was rejected, so the new owner re-reads records the old one had already processed (hence duplicates, and the need for idempotent handling). Heartbeats run on a separate thread and are governed by `session.timeout.ms`; this is the poll-interval limit."

      - type: order
        kind: steps
        prompt: "A member of a consumer group crashes. Put the steps of the classic (eager) rebalance in order."
        lines:
          - "The group coordinator declares the member dead and triggers a rebalance"
          - "Surviving consumers give up (revoke) all their partitions, committing offsets first if they can"
          - "The members re-join the group and the group leader computes a new partition assignment"
          - "The coordinator hands the new assignment to every member"
          - "Each consumer resumes its partitions from the last committed offsets"
        explanation: "In the eager protocol the whole group stops consuming for a while: that pause is why large or flapping groups hurt. The cooperative (incremental) protocol only moves the partitions that have to move. Resuming from the last committed offset is what makes duplicates possible: records processed after the last commit are read again."

      - type: spot
        prompt: "Every record must be processed at least once, even across crashes. Tap the line that breaks this guarantee."
        source: |
          while (running) {
              val records = consumer.poll(Duration.ofMillis(500))
              consumer.commitSync()
              for (r in records) {
                  process(r)
              }
          }
        answers: [3]
        explanation: "The offsets of the polled batch are committed before any record is processed. If the app crashes between the commit and `process`, those records are skipped for good: at-most-once. Commit after processing (at-least-once) and make `process` idempotent, because a crash between the processing and the commit means the batch is delivered again."

      - type: multi
        prompt: "Select ALL settings that reduce the chance of losing a write that the producer has already seen acknowledged."
        options:
          - { id: a, text: "acks=all on the producer" }
          - { id: b, text: "Replication factor 3 with min.insync.replicas=2 (which is enforced for acks=all writes)" }
          - { id: c, text: "Unclean leader election disabled" }
          - { id: d, text: "acks=1, because the leader's acknowledgment is enough" }
          - { id: e, text: "A larger linger.ms so batches are bigger" }
        answers: [a, b, c]
        explanation: "With acks=all the leader waits for the in-sync replicas, and min.insync.replicas sets how many must be in sync for a write to be accepted at all, so an acknowledged write survives the loss of one broker. Disabling unclean leader election stops an out-of-date replica from becoming leader and discarding acknowledged records (at the price of availability). With acks=1 the leader can fail before replicating. linger.ms is a throughput knob, not a durability one."

      - type: single
        prompt: "A topic has 6 partitions and a consumer group of 6 instances, each at capacity. Lag keeps growing at peak. In a regular consumer group, which of these will NOT raise the group's throughput?"
        options:
          - { id: a, text: "Starting 6 more instances of the group: each partition has one owner, so the extras sit idle" }
          - { id: b, text: "Making per-record work cheaper, for example by batching database writes in each poll" }
          - { id: c, text: "Adding partitions and consumers, accepting that keys map to different partitions afterwards" }
          - { id: d, text: "Handing records from each poll to a worker pool and committing only offsets of finished records" }
        answer: a
        explanation: "Within one group the partition count caps useful parallelism. Options B, C and D all add capacity per partition or add partitions, each with a cost: C breaks key-to-partition stability, and D needs careful offset handling and loses strict per-partition ordering of side effects unless you hash by key to workers. This is also why you size partitions with the peak consumer count in mind."

      - type: open
        prompt: "Explain how partitions, keys and consumer groups work together in Kafka, and how you would choose the key for an order-events topic."
        modelAnswer: "A topic is split into partitions, and a partition is the unit of both ordering and parallelism: records are ordered within a partition, not across them. A consumer group shares the work: each partition is assigned to exactly one member of the group, so the useful number of consumers is capped by the partition count, and different groups each receive every record independently. The record key decides the partition, so I choose the key as the entity whose events must stay in order, such as the order id; that keeps all events of one order in one partition and in sequence. I watch for hot keys that overload one partition, and I plan the partition count up front, because adding partitions later changes the key-to-partition mapping."
        keyPoints:
          - point: "A topic is split into partitions; ordering is guaranteed only within a partition"
            keywords: ["within a partition", "per partition", "inside a partition", "one partition", "partition is the unit"]
          - point: "In a consumer group each partition goes to exactly one member, so parallelism is capped by the partition count; different groups each get all records"
            keywords: ["exactly one", "at most one", "capped", "different groups", "each group", "one consumer per partition"]
          - point: "Key by the entity whose events must stay ordered (orderId, customerId) so related events share a partition"
            keywords: ["orderid", "order id", "entity", "same key", "same partition", "customerid"]
          - point: "Watch for hot keys, and plan the partition count because changing it remaps keys"
            keywords: ["hot", "skew", "remap", "plan the partition", "changing the partition", "adding partitions"]
        followUps:
          - when: covered
            point: 3
            prompt: "One customer generates 40% of all traffic and you key by customer id. What happens, and what can you do?"
            modelAnswer: "That customer's partition becomes a hot partition: its single consumer is the bottleneck while the others idle, and lag builds up. If ordering is only needed per order, use a finer key such as the order id. If strict per-customer ordering is required, the options are limited: give heavy customers a dedicated topic or partition set, or add a salt to spread them and give up ordering for that customer. It is a trade-off between ordering and balance."
            keyPoints:
              - point: "A hot partition, bottlenecked on one consumer, with growing lag"
                keywords: ["hot", "skew", "one partition", "bottleneck"]
              - point: "A finer-grained key if the ordering requirement allows it"
                keywords: ["finer", "orderid", "order id", "granular"]
              - point: "Salting or dedicated capacity trades away ordering or adds complexity"
                keywords: ["salt", "dedicated", "trade", "ordering"]
          - when: missed
            point: 4
            prompt: "What happens to the existing keys when you raise a topic from 6 to 12 partitions?"
            modelAnswer: "The default partitioner computes hash(key) modulo the partition count, so with a different count many keys map to a different partition. New records for a key may land in a different partition than its older records, which breaks per-key ordering across the change and any per-partition state locality. So plan capacity up front, or create a new topic with more partitions and migrate to it deliberately."
            keyPoints:
              - point: "The hash modulo the partition count changes, so keys remap to different partitions"
                keywords: ["modulo", "mod", "remap", "different partition"]
              - point: "Per-key ordering across the change is lost"
                keywords: ["order"]
              - point: "Over-provision up front or migrate to a new topic"
                keywords: ["plan", "new topic", "over-provision", "overprovision", "migrate"]

  - id: msg-patterns
    title: Reliability, events & sagas
    questions:
      - type: code
        prompt: "Write `decide(kind, attempt, maxAttempts, baseMs)` for a consumer's failure handling. `attempt` is how many times the message has failed so far (1 after the first failure). A `permanent` error (a poison message that can never succeed) goes straight to the dead-letter queue. A `transient` error is retried while `attempt < maxAttempts`, waiting `baseMs * 2^(attempt - 1)` ms, and goes to the dead-letter queue once the attempts are used up. Return `{action: 'retry', delayMs}` or `{action: 'dead-letter'}`."
        starter: |
          function decide(kind, attempt, maxAttempts, baseMs) {
            // your code
            return { action: 'retry', delayMs: 0 };
          }
        entry: decide
        tests:
          - { args: ["transient", 1, 3, 100], expect: { action: "retry", delayMs: 100 } }
          - { args: ["transient", 2, 3, 100], expect: { action: "retry", delayMs: 200 } }
          - { args: ["transient", 3, 3, 100], expect: { action: "dead-letter" } }
          - { args: ["permanent", 1, 3, 100], expect: { action: "dead-letter" } }
          - { args: ["transient", 4, 5, 250], expect: { action: "retry", delayMs: 2000 }, hidden: true }
          - { args: ["transient", 1, 1, 100], expect: { action: "dead-letter" }, hidden: true }
          - { args: ["permanent", 5, 10, 100], expect: { action: "dead-letter" }, hidden: true }
        solution: |
          function decide(kind, attempt, maxAttempts, baseMs) {
            if (kind === 'permanent' || attempt >= maxAttempts) {
              return { action: 'dead-letter' };
            }
            return { action: 'retry', delayMs: baseMs * 2 ** (attempt - 1) };
          }
        kotlin: |
          sealed interface Decision {
              data class Retry(val delayMs: Long) : Decision
              object DeadLetter : Decision
          }

          fun decide(permanent: Boolean, attempt: Int, maxAttempts: Int, baseMs: Long): Decision =
              if (permanent || attempt >= maxAttempts) Decision.DeadLetter
              else Decision.Retry(baseMs * (1L shl (attempt - 1)))
        explanation: "Classify first, then retry. Retrying a poison message (a payload that fails deserialisation or validation) only burns time and blocks the partition, so it goes to the dead-letter queue immediately. Transient failures (timeouts, a dependency being down) deserve bounded retries with growing delays; add random jitter in production. Always keep the original payload and failure metadata on the dead-letter record so it can be inspected and replayed."

      - type: single
        prompt: "A colleague says: 'Kafka has exactly-once semantics, so our consumers do not need to be idempotent.' What is the best response?"
        options:
          - { id: a, text: "Exactly-once covers read-process-write inside Kafka (idempotent producer plus transactions); external side effects such as database writes can still repeat" }
          - { id: b, text: "Exactly-once delivery is mathematically impossible in any distributed system, so Kafka's claim is only marketing and consumers must be idempotent" }
          - { id: c, text: "Setting enable.idempotence=true on the producer makes every consumer safe from duplicates, including external side effects" }
          - { id: d, text: "That is correct for any consumer once acks=all and min.insync.replicas are set, because no record is delivered twice then" }
        answer: a
        explanation: "Kafka's exactly-once semantics are real but scoped: the idempotent producer removes duplicates caused by producer retries, and transactions make a consume-transform-produce step atomic, with consumers reading only committed data. The moment the consumer touches a system outside Kafka, a crash after the side effect but before the offset commit replays the record. Idempotent handlers (inbox table, unique constraint, natural idempotency) are still required. acks=all is about durability, not duplicates."

      - type: match
        prompt: "Match each reliability concept to what it does."
        pairs:
          - { left: "Transactional outbox", right: "Stores the event in the same database transaction as the state change and relays it to the broker afterwards" }
          - { left: "Inbox table", right: "Records processed message ids in the same transaction as the side effect so duplicates become no-ops" }
          - { left: "Dead-letter queue", right: "Parks messages that keep failing so they stop blocking the stream and can be inspected" }
          - { left: "Compensating action", right: "A business-level undo of an already committed step, such as refunding a payment" }
          - { left: "Consumer lag", right: "How far a group's committed offset trails the newest offset of a partition" }
        explanation: "Outbox and inbox are mirror images: the outbox makes publishing reliable at the producer side, the inbox makes consuming idempotent at the consumer side. Lag is the first health signal of a consumer group, and a DLQ without alerting and a replay procedure is just a place where problems go to be forgotten."

      - type: single
        prompt: "How do a classic queue (RabbitMQ-style) and a log (Kafka-style) differ at their core?"
        options:
          - { id: a, text: "A queue tracks acknowledgment per message and removes it once consumed; a log keeps records and each group tracks its own offset" }
          - { id: b, text: "A queue can hold only one message at a time, so producers have to wait for each consumer, while a log buffers many records on disk" }
          - { id: c, text: "A log delivers each record to exactly one consumer overall and then deletes it, while a queue retains every message and broadcasts it to all consumers" }
          - { id: d, text: "A queue is always faster than a log, because a log has to write every record to disk and keep it for days" }
        answer: a
        explanation: "Queue: work distribution, with per-message acks, requeueing and routing through exchanges. Log: an append-only history that consumers read at their own pace and can rewind, which suits event streaming, reprocessing and many independent readers. Neither is simply better: pick the queue for task distribution with rich routing, the log for event streams, replay and high throughput. (RabbitMQ also offers stream-style queues, so the distinction is about the model, not the product name.)"

      - type: single
        prompt: "You add an optional field to an event that producers publish and several teams consume, using a schema registry with compatibility checks. Which kind of change is generally safe?"
        options:
          - { id: a, text: "Adding a new field with a default, which old readers ignore and new readers can fill in" }
          - { id: b, text: "Changing a field's type from an integer to a string, since both are scalar values" }
          - { id: c, text: "Making a previously optional field required, since every current producer sets it" }
          - { id: d, text: "Reusing a removed field's name or number for a different meaning, once nobody sends the old one" }
        answer: a
        explanation: "Safe evolution is additive: new optional fields with defaults, and removing optional fields in a coordinated way. Type changes, tightening optional to required, and reusing identifiers for other meanings break either old readers or old data. Choose the compatibility mode (backward, forward, full) to match whether consumers or producers are upgraded first, and remember that events stay in the log for a long time, so old data will be read by new code."

      - type: order
        kind: steps
        prompt: "An order saga using choreography fails at the stock step. Put the events in order."
        lines:
          - "The order service creates the order as PENDING and emits OrderCreated"
          - "The payment service charges the customer and emits PaymentCaptured"
          - "The stock service cannot reserve an item and emits StockRejected"
          - "The payment service reacts to StockRejected by refunding the charge and emits PaymentRefunded"
          - "The order service reacts to PaymentRefunded by marking the order CANCELLED"
        explanation: "There is no distributed transaction: each service commits locally and reacts to events. The refund is a compensating action, a new business operation rather than a rollback, so it must itself be idempotent and retryable. A saga is eventually consistent, so the UI should show states like PENDING instead of pretending the order is final."

      - type: fill
        lang: sql
        prompt: "Make the consumer idempotent with an inbox table. Complete the statement and the rule that decides whether to process the message."
        template: |
          INSERT INTO inbox (message_id, received_at)
          VALUES (:id, now())
          ON CONFLICT (message_id) DO [[1]];
          -- one row inserted: process the message
          -- [[2]] rows inserted: a duplicate, skip it
        bank: ["NOTHING", "UPDATE", "0", "1", "NULL"]
        answers: ["NOTHING", "0"]
        explanation: "The unique key on `message_id` turns duplicate detection into a database guarantee, even with several consumer instances. Run the insert and the business change in the same transaction: if the business step fails, the inbox row rolls back too and the redelivery is processed normally. (`ON CONFLICT` is PostgreSQL syntax; other databases have equivalents such as INSERT IGNORE or catching the unique-violation error.)"

      - type: open
        prompt: "A Kafka consumer updates your database from payment events. In production you see duplicate processing and a poison message that stalls a partition. Describe how you design retries, dead-lettering and idempotency."
        modelAnswer: "I assume at-least-once delivery: commit the offset only after the work is done, so duplicates will happen, and the handler must be idempotent, using an inbox table or a unique constraint on the event id in the same transaction as the side effect, or an operation that is naturally idempotent such as an upsert. I classify errors: transient ones (timeouts, a dependency down) are retried a bounded number of times with backoff, while permanent ones (a malformed payload) go straight to a dead-letter topic so they do not block the partition. The dead-letter record keeps the original payload plus error and source offset, and we alert on it and have a documented way to replay after a fix. To avoid blocking the partition during long retries I can use separate retry topics with delays, accepting that this weakens ordering for that key."
        keyPoints:
          - point: "At-least-once with commit after processing, so the handler must be idempotent (inbox table or unique event id in the same transaction, or naturally idempotent operations)"
            keywords: ["idempotent", "inbox", "unique constraint", "event id", "dedup", "upsert"]
          - point: "Classify errors: transient failures are retried with bounded backoff, permanent ones go straight to the dead-letter topic"
            keywords: ["transient", "permanent", "poison", "backoff", "bounded", "classify"]
          - point: "The dead-letter record keeps payload and error context, with alerting and a replay path"
            keywords: ["dead-letter", "dead letter", "dlq", "replay", "alert", "metadata"]
          - point: "Non-blocking retries via retry topics keep the partition moving, at a cost to ordering"
            keywords: ["retry topic", "delay topic", "non-blocking", "separate topic", "ordering"]
        followUps:
          - when: missed
            point: 4
            prompt: "What is head-of-line blocking in a partition, and how do retry topics help?"
            modelAnswer: "A partition is consumed in order, so if one record keeps failing and you retry it in place, every record behind it has to wait: the partition stalls and lag grows. A retry topic (or delay topic) moves the failing record aside so the main flow continues and the record is retried later. The cost is that records for the same key can now be processed out of order."
            keyPoints:
              - point: "In-order consumption means one failing record blocks everything behind it"
                keywords: ["block", "stall", "behind", "wait"]
              - point: "A retry or delay topic moves the failing record out of the main flow"
                keywords: ["retry topic", "delay topic", "separate topic", "aside"]
              - point: "The trade-off is possible out-of-order processing for that key"
                keywords: ["order"]
          - when: covered
            point: 1
            prompt: "Your handler calls a payment provider over HTTP, so it cannot share a database transaction with it. How do you make that call safe to repeat?"
            modelAnswer: "Send an idempotency key derived from the event id with every attempt, so the provider returns the original result instead of charging again. Record the outcome locally, and reconcile by querying the provider's status for the cases where the response was lost, so a retry after an ambiguous failure never creates a second charge."
            keyPoints:
              - point: "An idempotency key derived from the event id, sent on every attempt"
                keywords: ["idempotency key", "event id"]
              - point: "The provider dedupes and returns the original result"
                keywords: ["original", "same result", "dedupe", "deduplicate"]
              - point: "Record the outcome and reconcile by querying status after ambiguous failures"
                keywords: ["reconcil", "status", "query", "record"]
