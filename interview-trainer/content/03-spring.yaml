id: spring
title: Spring in Depth
icon: leaf
description: Proxies, transactions, auto-configuration, JPA pitfalls and the Spring + Kotlin gotchas.
lessons:
  - id: spring-core
    title: Beans, proxies & transactions
    questions:
      - type: single
        hint: "Which object receives the call when a method calls another method of its own class?"
        prompt: "`placeOrder` is called from a controller. Why is `save` NOT transactional?"
        code:
          source: |
            @Service
            class OrderService(private val repo: OrderRepository) {

                fun placeOrder(o: Order) {
                    validate(o)
                    save(o)
                }

                @Transactional
                fun save(o: Order) {
                    repo.save(o)
                }
            }
        options:
          - { id: a, text: "Self-invocation bypasses the Spring proxy, so the transactional advice never runs" }
          - { id: b, text: "`@Transactional` takes effect on `private` helpers called from a public method" }
          - { id: c, text: "Spring only starts transactions for methods on repository interfaces, not on services" }
          - { id: d, text: "`@Transactional` belongs on the interface, as class-level proxies ignore it" }
        answer: a
        explanation: "Spring AOP wraps the bean in a proxy; only calls that come through the proxy are intercepted. A call from inside the same instance goes straight to `this.save`. Fix: move `save` to another bean, annotate `placeOrder`, or use programmatic `TransactionTemplate`. The annotation works on public methods of any Spring bean, not only repositories, and not only on interfaces."

      - type: single
        hint: "Spring has to subclass your class. What does Kotlin do to classes by default, and what changes that?"
        prompt: "A Kotlin `@Service` class fails at startup because Spring can't create a CGLIB proxy for a final class. What is the idiomatic fix?"
        options:
          - { id: a, text: "Apply the kotlin-spring (all-open) plugin so Spring-annotated classes become open" }
          - { id: b, text: "Mark each method `public` so the proxy can intercept it from outside the class" }
          - { id: c, text: "Switch the bean to `@Scope(\"prototype\")` so Spring creates a fresh, unproxied instance each time" }
          - { id: d, text: "Annotate the class with `@JvmStatic` so Spring can generate the proxy at compile time" }
        answer: a
        explanation: "Kotlin classes and members are final by default; CGLIB proxies subclass the bean. The `kotlin-spring` plugin opens classes annotated with `@Component`, `@Transactional`, `@Configuration` etc. (Spring Initializr adds it by default). Method visibility, bean scope or JVM annotations do not change the fact that the class itself is final."

      - type: multi
        prompt: Select all real benefits of constructor injection over field injection.
        options:
          - { id: a, text: "Dependencies can be `val`s (immutability)" }
          - { id: b, text: "The class can be instantiated in a plain unit test without Spring or reflection" }
          - { id: c, text: "Circular dependencies are resolved more easily" }
          - { id: d, text: "An object can never exist in a partially-initialised state" }
          - { id: e, text: "It is required for `@Autowired` to work" }
        answers: [a, b, d]
        explanation: "Constructor injection makes dependencies explicit and mandatory, and circular dependencies fail fast instead of being silently tolerated. With a single constructor `@Autowired` isn't even needed."

      - type: single
        hint: "When does the constructor injection of the prototype happen, and how many times is the singleton constructed?"
        prompt: "A singleton bean has a `@Scope(\"prototype\")` bean injected through its constructor. How many prototype instances does the singleton use?"
        options:
          - { id: a, text: "One: it is injected only once, when the singleton itself is created" }
          - { id: b, text: "A new one on each method call, because the bean is declared as prototype" }
          - { id: c, text: "One per HTTP request, because the singleton is mostly called from web threads" }
          - { id: d, text: "One per thread that calls the singleton, since prototype beans are bound to threads" }
        answer: a
        explanation: "Injection happens once. To get a fresh instance per use, inject an `ObjectProvider<T>` (call `getObject()`), or use a scoped proxy."

      - type: single
        hint: "Which kinds of exception trigger a rollback by default?"
        prompt: What happens to the data when this method runs?
        code:
          source: |
            @Transactional
            fun import(file: Path) {
                repo.save(Record("a"))
                throw IOException("disk error")
            }
        options:
          - { id: a, text: "The record is committed anyway: by default only unchecked exceptions (RuntimeException or Error) trigger a rollback" }
          - { id: b, text: "The transaction rolls back, because each exception triggers a rollback by default" }
          - { id: c, text: "The code does not compile, because Kotlin has no checked exceptions to throw" }
          - { id: d, text: "The record is saved in a separate transaction and survives only if REQUIRES_NEW is set" }
        answer: a
        explanation: "Kotlin has no checked exceptions, but `IOException` is still a checked type from Spring's point of view. Use `@Transactional(rollbackFor = [Exception::class])` or throw an unchecked exception."

      - type: fill
        hint: "Each annotation maps to a part of the HTTP request: the verb, a URL segment, the body."
        prompt: Complete the REST controller annotations.
        template: |
          @RestController
          @RequestMapping("/orders")
          class OrderController(private val service: OrderService) {

              @[[1]]("/{id}")
              fun get(@[[2]] id: Long) = service.find(id)

              @PostMapping
              fun create(@[[3]] @Valid cmd: CreateOrder) = service.create(cmd)
          }
        bank: ["GetMapping", "PathVariable", "RequestBody", "RequestParam", "PostMapping", "ResponseBody"]
        answers: ["GetMapping", "PathVariable", "RequestBody"]
        explanation: "`@PathVariable` binds `{id}` from the URL, `@RequestParam` binds query-string values, `@RequestBody` deserialises the JSON body (then `@Valid` triggers Bean Validation)."

      - type: match
        prompt: Match each annotation to what it does.
        pairs:
          - { left: "`@Repository`", right: "Marks a data-access bean and translates persistence exceptions" }
          - { left: "`@Configuration`", right: "Declares `@Bean` methods; the class itself is proxied" }
          - { left: "`@RestController`", right: "`@Controller` plus `@ResponseBody` on every handler" }
          - { left: "`@ControllerAdvice`", right: "Shared exception handling across controllers" }
        explanation: "`@Repository`'s exception translation turns vendor errors into Spring's `DataAccessException` hierarchy. `@Configuration` classes are CGLIB-proxied so calling one `@Bean` method from another returns the singleton instead of creating a second instance."

      - type: order
        kind: steps
        prompt: Put the life of a Spring singleton bean in the right order.
        lines:
          - "The container instantiates the bean through its constructor"
          - "Dependencies are injected"
          - "Initialisation callbacks run (@PostConstruct, afterPropertiesSet)"
          - "Post-processors may wrap the bean in an AOP proxy (e.g. for @Transactional)"
          - "The bean serves requests"
          - "On shutdown, @PreDestroy callbacks run"
        explanation: "The proxy is created after initialisation, which is why `@PostConstruct` runs on the raw bean (so a `@Transactional` method called from it is not transactional) and why other beans receive the proxy, not the original."

      - type: open
        hint: "Start from what the starter dependencies put on the classpath and the conditions guarding each configuration class."
        prompt: How does Spring Boot auto-configuration work, and how would you find out why a bean wasn't created?
        modelAnswer: "@SpringBootApplication enables auto-configuration, which loads the candidate configuration classes listed in META-INF/spring/org.springframework.boot.autoconfigure.AutoConfiguration.imports. Each is guarded by conditions such as @ConditionalOnClass, @ConditionalOnProperty and @ConditionalOnMissingBean, so it only applies if the classpath and properties match and your own beans haven't already defined the same thing (user config backs off the default). To debug, start with --debug (or debug=true) to print the conditions evaluation report, or use the Actuator conditions endpoint."
        keyPoints:
          - point: "Auto-configuration classes are discovered from the AutoConfiguration.imports file (via @EnableAutoConfiguration/@SpringBootApplication)"
            keywords: ["autoconfiguration.imports", "spring.factories", "enableautoconfiguration", "springbootapplication", "imports"]
          - point: "Conditional annotations (OnClass, OnProperty, OnMissingBean) decide whether each applies; user beans make defaults back off"
            keywords: ["conditionalonclass", "conditionalonmissingbean", "conditionalonproperty", "conditional", "back off", "backs off"]
          - point: "Debug using the conditions report (--debug) or the Actuator conditions endpoint"
            keywords: ["--debug", "debug", "conditions report", "condition evaluation", "actuator", "conditions endpoint"]
        followUps:
          - when: covered
            point: 2
            prompt: "How do you replace an auto-configured bean with your own, and what do you check if your version isn't used?"
            modelAnswer: "Declare your own `@Bean` of the same type. Auto-configurations are guarded by `@ConditionalOnMissingBean`, so they back off when yours exists. If yours isn't used, check that it is component-scanned (right package, or imported), that no other bean is marked `@Primary`, and read the conditions report. You can also exclude the whole auto-configuration with `@SpringBootApplication(exclude = ...)` or `spring.autoconfigure.exclude`."
            keyPoints:
              - point: "Define your own @Bean; the auto-configuration backs off via @ConditionalOnMissingBean"
                keywords: ["conditionalonmissingbean", "backs off", "back off", "own bean", "@bean"]
              - point: "Check it is actually scanned or imported and not shadowed (for example by @Primary)"
                keywords: ["scanned", "component scan", "package", "primary", "imported"]
              - point: "Exclude the auto-configuration, or read the conditions report"
                keywords: ["exclude", "conditions report", "--debug"]
          - when: missed
            point: 3
            prompt: "What does the conditions evaluation report tell you, and how do you read it?"
            modelAnswer: "Started with `--debug` or `debug=true`, it prints 'Positive matches' (auto-configurations that applied), 'Negative matches' (the ones that did not, with the failing condition, for example a missing class or an existing bean) and 'Unconditional classes'. For a missing bean, find its auto-configuration under Negative matches and read which condition failed. The Actuator `conditions` endpoint shows the same information at runtime."
            keyPoints:
              - point: "Positive and negative matches, with the condition that failed"
                keywords: ["positive", "negative", "match", "condition"]
              - point: "Enabled with --debug or debug=true"
                keywords: ["--debug", "debug"]
              - point: "The Actuator conditions endpoint shows the same at runtime"
                keywords: ["actuator", "endpoint", "runtime"]

  - id: spring-data-web
    title: Data, web & performance
    questions:
      - type: single
        hint: "One query for the orders, then count how many lazy loads follow."
        prompt: "`items` is a lazy `@OneToMany`. For 100 orders, how many SQL queries does this run?"
        code:
          source: |
            val orders = orderRepo.findAll()
            orders.forEach { println(it.items.size) }
        options:
          - { id: a, text: "101" }
          - { id: b, text: "1" }
          - { id: c, text: "2" }
          - { id: d, text: "100" }
        answer: a
        explanation: "The classic N+1: one query for the orders, then one lazy-load per order. It's invisible in small test data and devastating in production."

      - type: multi
        prompt: Select all effective fixes for the N+1 problem above.
        options:
          - { id: a, text: "`JOIN FETCH` in the query" }
          - { id: b, text: "`@EntityGraph` on the repository method" }
          - { id: c, text: "`hibernate.default_batch_fetch_size`" }
          - { id: d, text: "Switch the association to `FetchType.EAGER`" }
          - { id: e, text: "Add an index on the foreign key" }
        answers: [a, b, c]
        explanation: "Fetch joins/entity graphs load the association in the same query; batch fetching turns N queries into N/batch. EAGER doesn't fix it for `findAll()` (it still issues one select per parent) and makes every other query heavier. An index speeds each query but doesn't reduce their number."

      - type: single
        hint: "Compare how long the connection is borrowed with how long you actually need it."
        prompt: "Spring Boot enables `spring.jpa.open-in-view` by default. What is its main production risk?"
        options:
          - { id: a, text: "The DB connection is held for the whole web request, and lazy loading in the view layer hides N+1s" }
          - { id: b, text: "It disables the second-level cache for each entity that is loaded during the request" }
          - { id: c, text: "It makes each transaction read-only unless the service explicitly marks it otherwise" }
          - { id: d, text: "It opens a separate transaction for each repository call during the request, multiplying commits and locks" }
        answer: a
        explanation: "Many teams set it to false and fetch what they need explicitly (projections or fetch joins) inside the service layer. The setting only keeps the persistence session (and with it the connection) open for the whole request; it does not touch caching, read-only mode or how many transactions run."

      - type: single
        prompt: "A service is CPU-bound, uses blocking JDBC and a small team. Which stack is the best default?"
        options:
          - { id: a, text: "Spring MVC (optionally with virtual threads)" }
          - { id: b, text: "Spring WebFlux with R2DBC, to be \"non-blocking\"" }
          - { id: c, text: "WebFlux, but call JDBC directly on the event loop" }
          - { id: d, text: "Plain servlets, to avoid framework overhead on CPU-bound requests" }
        answer: a
        explanation: "Reactive stacks pay off for high-concurrency, I/O-bound workloads with non-blocking drivers end to end. Blocking JDBC on a WebFlux event loop is an outage waiting to happen. For CPU-bound work, reactive gives you nothing, and raw servlets only give up Spring's productivity (its overhead is negligible next to CPU-bound work)."

      - type: single
        hint: "Look under the `spring.threads` prefix."
        prompt: Which Spring Boot 3.2+ property switches request handling to virtual threads?
        options:
          - { id: a, text: "spring.threads.virtual.enabled=true" }
          - { id: b, text: "server.tomcat.virtual-threads.enabled=true" }
          - { id: c, text: "spring.mvc.async.virtual=true" }
          - { id: d, text: "spring.task.execution.virtual=true" }
        answer: a
        explanation: "It needs Java 21+. Virtual threads help with blocking I/O concurrency; they don't make CPU-bound work faster, and a bounded resource (like the DB pool) is still your real limit."

      - type: fill
        hint: "One annotation fills the cache on a read; the other empties it."
        prompt: Cache exchange rates per currency, and allow clearing the whole cache.
        template: |
          @Service
          class RateService(private val client: RateClient) {

              @[[1]](cacheNames = ["rates"], key = "#currency")
              fun rate(currency: String): BigDecimal = client.fetch(currency)

              @[[2]](cacheNames = ["rates"], allEntries = true)
              fun refresh() {}
          }
        bank: ["Cacheable", "CacheEvict", "CachePut", "Transactional", "Async"]
        answers: ["Cacheable", "CacheEvict"]
        explanation: "`@Cacheable` skips the method on a hit; `@CachePut` always runs and updates the cache; `@CacheEvict` removes entries. Remember the same proxy caveat as `@Transactional`: self-invocation bypasses caching."

      - type: spot
        hint: "Look for a repository call inside a loop."
        prompt: This endpoint is fast with 10 orders and slow with 10,000. Tap the line that causes it.
        source: |
          @Transactional(readOnly = true)
          fun report(): List<OrderRow> {
              val orders = orderRepo.findAll()
              return orders.map { o ->
                  OrderRow(o.id, o.items.size, customerRepo.findById(o.customerId).get().name)
              }
          }
        answers: [5]
        explanation: "Per order, this line lazy-loads `items` and runs a customer lookup: two extra queries per row (N+1). Fetch what you need up front (join fetch / entity graph), load the customers with one `findAllById`, or use a DTO projection."

      - type: estimate
        hint: "With a batch size of 10, how many lazy loads cover 100 parents? Don't forget the initial query."
        prompt: "100 orders each have a lazy `items` collection, and `hibernate.default_batch_fetch_size` is 10. You touch `items` of every order. How many SQL queries run in total, including the one that loads the orders?"
        answer: 11
        tolerance: 0
        unit: queries
        explanation: "One query loads the orders, then Hibernate initialises the collections in batches of 10 using `IN (...)`: 100 / 10 = 10 more. 1 + 10 = 11, instead of 101 without batching."

      - type: single
        prompt: What does this log tell you?
        code:
          lang: text
          source: |
            select o.* from orders o
            select i.* from order_item i where i.order_id=?   -- 1
            select i.* from order_item i where i.order_id=?   -- 2
            select i.* from order_item i where i.order_id=?   -- 3
            ... (97 more identical statements)
        options:
          - { id: a, text: "N+1: items are lazy-loaded one order at a time; use a join fetch, entity graph or batch fetching" }
          - { id: b, text: "A missing index on `order_item.order_id`, so each lookup does a full table scan" }
          - { id: c, text: "A connection leak: each lazy load opens another connection that stays open" }
          - { id: d, text: "A cache stampede: 100 requests missed the cache and hit the database at once" }
        answer: a
        explanation: "One statement for the parent rows followed by the same child query once per row is the signature of N+1. An index would make each statement faster, but you'd still run 100 of them. Connections are reused here and there is no cache involved: the repeated statements come from lazy loading inside one request."

      - type: open
        prompt: An endpoint got slow under load and the database CPU is high. Walk through how you'd diagnose and fix it at the Spring/JPA level.
        modelAnswer: "Measure first: look at p95/p99 latency and traces to confirm which endpoint and which queries, using metrics/APM and the DB's slow-query log. Enable SQL logging or a tool like Hibernate statistics to spot N+1 and unbounded queries, and run EXPLAIN on the heavy ones to find missing indexes. Fix with fetch joins/entity graphs or batch fetching, DTO projections instead of full entities, pagination, and the right indexes. Then reduce repeated reads with caching, check the Hikari pool size, and re-run a load test to verify the improvement."
        keyPoints:
          - point: "Measure first: metrics/traces/slow-query log to find the actual hot query or endpoint"
            keywords: ["measure", "profil", "apm", "trace", "slow query", "slow-query", "metrics", "p99"]
          - point: "Find N+1 / missing indexes using SQL logging and EXPLAIN"
            keywords: ["n+1", "explain", "index", "sql log", "statistics", "query plan"]
          - point: "Fix with fetch joins/entity graphs/batching, projections, pagination"
            keywords: ["fetch join", "entitygraph", "entity graph", "batch", "projection", "dto", "pagina"]
          - point: "Add caching / tune the connection pool and verify with a load test"
            keywords: ["cache", "caching", "hikari", "pool", "load test", "verify"]
        followUps:
          - when: missed
            point: 4
            prompt: "How do you size a HikariCP connection pool, and what happens if it is too big?"
            modelAnswer: "Start from the work the database can really do in parallel (its cores and I/O), not from the number of web threads: pools are usually small, tens of connections. Use Little's Law (throughput times the time a request holds a connection) to estimate the need, then measure pending threads and connection wait time. A pool that is too big makes the database context-switch and can turn a slow endpoint into a database outage; one that is too small makes requests queue for a connection."
            keyPoints:
              - point: "Size from what the DB can do in parallel and Little's Law, not from the web threads"
                keywords: ["little", "parallel", "cores", "not from"]
              - point: "Measure pending threads and connection wait time"
                keywords: ["pending", "wait", "acquire", "metric"]
              - point: "Too big overloads the database; too small makes requests queue"
                keywords: ["context", "overload", "queue"]
          - when: covered
            point: 1
            prompt: "You fixed the N+1 and the database is quiet now, but p99 is still high. What do you look at next?"
            modelAnswer: "Go back to the trace: where does the time go now? Look for time waiting for a connection from the pool, slow downstream HTTP calls, serialisation of large responses, GC pauses, a saturated thread pool and lock contention. Look at percentiles per endpoint rather than averages, and compare a slow trace with a fast one."
            keyPoints:
              - point: "Use traces to find where the time goes now instead of guessing"
                keywords: ["trace", "where the time", "profil"]
              - point: "Candidates: pool wait, downstream calls, serialisation, GC, thread pool, locks"
                keywords: ["pool", "downstream", "serializ", "serialis", "gc", "thread pool", "lock"]
              - point: "Compare slow and fast requests; look at percentiles, not averages"
                keywords: ["percentile", "p99", "compare", "average"]

  - id: spring-advanced
    title: Transactions, config & testing
    questions:
      - type: match
        prompt: Match each transaction propagation to its behaviour.
        pairs:
          - { left: "`REQUIRED`", right: "Joins the current transaction, or starts one if none exists (the default)" }
          - { left: "`REQUIRES_NEW`", right: "Suspends the current transaction and runs in a new, independent one" }
          - { left: "`NESTED`", right: "Runs inside the current transaction using a savepoint, when the transaction manager supports it" }
          - { left: "`MANDATORY`", right: "Throws an exception if there is no existing transaction" }
          - { left: "`NEVER`", right: "Throws an exception if a transaction exists" }
        explanation: "`REQUIRED` is what you want most of the time. `REQUIRES_NEW` suits work that must survive an outer rollback (an audit record), at the price of a second database connection. `NESTED` lets an inner failure roll back to the savepoint without aborting the outer transaction, but not every transaction manager supports it. `MANDATORY` and `NEVER` are assertions about the caller."

      - type: single
        prompt: A row fails inside `importRow` and the exception is caught as shown. What happens when `importAll` returns?
        code:
          source: |
            @Service
            class Importer(private val worker: RowWorker, private val repo: ImportRepo) {

                @Transactional
                fun importAll(rows: List<Row>) {
                    for (row in rows) {
                        try {
                            worker.importRow(row)   // another bean, @Transactional (REQUIRED), throws on bad data
                        } catch (e: RuntimeException) {
                            log.warn("skipping {}", row, e)
                        }
                    }
                    repo.markFinished()
                }
            }
        options:
          - { id: a, text: "UnexpectedRollbackException: the inner proxy marked the shared transaction rollback-only, so the outer commit fails" }
          - { id: b, text: "The good rows are committed and only the failing row is skipped, as the log message says" }
          - { id: c, text: "The failing row's changes are rolled back alone, because the inner call used a savepoint" }
          - { id: d, text: "The outer commit succeeds, because the exception was caught inside the loop and did not reach the caller" }
        answer: a
        explanation: "With `REQUIRED` the inner call joins the outer transaction. When the exception leaves the inner proxy, Spring marks the whole transaction rollback-only, and catching it in the caller does not clear that mark. To skip bad rows independently use `REQUIRES_NEW` (or `NESTED`) on `importRow`, or validate before writing."

      - type: multi
        prompt: "Two requests update the same account with read-modify-write and one update is lost. Select all effective fixes."
        options:
          - { id: a, text: "Optimistic locking with a `@Version` column, so the second update fails and can be retried" }
          - { id: b, text: "A pessimistic write lock (`SELECT ... FOR UPDATE`) when reading the row" }
          - { id: c, text: "One atomic statement such as `UPDATE account SET balance = balance - :amount WHERE id = :id AND balance >= :amount`" }
          - { id: d, text: "Make the service method `synchronized` so only one thread runs the update at a time" }
          - { id: e, text: "Lower the isolation level to `READ_UNCOMMITTED` so readers never wait for writers" }
        answers: [a, b, c]
        explanation: "A lost update needs either detection (version check), exclusion (row lock) or a statement the database applies atomically. `synchronized` only covers one JVM, and with a proxy-based `@Transactional` the commit happens after the synchronized method has returned, so another thread can read the old value before the commit. Weaker isolation makes anomalies more likely, not less."

      - type: estimate
        prompt: "Each request holds one connection for its outer transaction and then, while still holding it, needs a second connection for a `REQUIRES_NEW` call. The pool has 10 connections and nothing else uses it. What is the largest number of concurrent requests for which a pool deadlock is impossible?"
        answer: 9
        tolerance: 0
        unit: requests
        explanation: "A pool cannot deadlock if at least one request can always finish: the rule is pool size >= requests x (connections per request - 1) + 1. With 9 requests holding one connection each, one connection is still free, so one request gets its second connection, completes and releases both. With 10 requests, all 10 connections are held by outer transactions and everybody waits for a second one until the timeout. Avoid holding a connection while asking for another."

      - type: fill
        prompt: Register the HTTP exporter only when it is enabled by a property, and a no-op exporter when no other `Exporter` bean exists.
        template: |
          @Configuration
          class ExporterConfig {

              @Bean
              @[[1]](prefix = "app.export", name = ["enabled"], havingValue = "true")
              fun httpExporter(): Exporter = HttpExporter()

              @Bean
              @[[2]]
              fun noopExporter(): Exporter = NoopExporter()
          }
        bank: ["ConditionalOnProperty", "ConditionalOnMissingBean", "ConditionalOnBean", "ConditionalOnClass", "Profile"]
        answers: ["ConditionalOnProperty", "ConditionalOnMissingBean"]
        explanation: "`@ConditionalOnProperty` turns a bean on from configuration. `@ConditionalOnMissingBean` makes the second bean a back-off default, the same mechanism auto-configuration uses; `@ConditionalOnBean` would do the opposite. Condition evaluation depends on the order in which bean definitions are processed, which is why these conditions are most reliable in auto-configuration classes."

      - type: multi
        prompt: Select all true statements about `@ConfigurationProperties`.
        options:
          - { id: a, text: "Properties with a common prefix are bound to a typed class, with relaxed binding: `app.max-retries` and `APP_MAXRETRIES` both bind to `maxRetries`" }
          - { id: b, text: "With `@Validated` and Bean Validation constraints, invalid configuration fails the startup" }
          - { id: c, text: "It can only bind `String` values, so numbers, durations and enums must be converted by hand in the class" }
          - { id: d, text: "The class must also be registered, for example with `@EnableConfigurationProperties` or `@ConfigurationPropertiesScan`, or be a bean" }
          - { id: e, text: "Values can only come from `application.properties` or YAML files, never from environment variables or command-line arguments" }
        answers: [a, b, d]
        explanation: "Typed, validated configuration fails fast at startup instead of with a `NullPointerException` hours later, and the same class is easy to construct in a unit test. Binding handles conversion (durations, lists, enums, nested objects) and reads from every property source, including environment variables and command-line arguments."

      - type: single
        prompt: What is the main problem with this metric?
        code:
          source: |
            fun onRequest(req: HttpServletRequest, userId: String) {
                registry.counter("api.requests", "path", req.requestURI, "user", userId).increment()
            }
        options:
          - { id: a, text: "Each distinct path and user pair creates a new time series, so unbounded tag values blow up memory" }
          - { id: b, text: "`counter()` is not thread-safe, so concurrent increments are lost under load" }
          - { id: c, text: "Counters of one name must always be registered with identical tag values, so a second registration with other values fails at runtime" }
          - { id: d, text: "Counters are unable to carry tags, so Micrometer silently drops `path` and `user` from the output" }
        answer: a
        explanation: "Each unique tag combination is its own series. Keep tag values low-cardinality and bounded: the route template (`/orders/{id}`), the status class, the outcome. Spring's own `http.server.requests` metric tags the URI template, not the raw URI, for exactly this reason. Put per-user detail into logs and traces instead. Counters can carry tags, are thread-safe, and the same name may be registered with many different tag values."

      - type: single
        prompt: "`@WebMvcTest(OrderController::class)` fails with `NoSuchBeanDefinitionException: OrderService`. What is the idiomatic fix?"
        options:
          - { id: a, text: "Provide the collaborator as a mock bean (`@MockBean` or `@MockitoBean`): the slice loads only web-layer beans" }
          - { id: b, text: "Replace it with `@SpringBootTest` for each controller test, so that the whole application context is available" }
          - { id: c, text: "Annotate `OrderService` with `@Controller` so that the web slice picks it up as a web-layer bean" }
          - { id: d, text: "Disable component scanning in the test, so that bean definitions are looked up nowhere" }
        answer: a
        explanation: "Test slices (`@WebMvcTest`, `@DataJpaTest`, `@JsonTest`, ...) start only the part of the context they are about: for MVC that is controllers, advice, converters and filters, but no `@Service` or `@Repository`. That keeps them fast and focused, and the missing collaborators become explicit test doubles. Use `@SpringBootTest` for the few tests that need the whole wiring."

      - type: open
        prompt: "A colleague says: \"I put `@Transactional` on every service method, so we are safe.\" How do you respond, and how do you design transaction boundaries?"
        modelAnswer: "I would push back, because a blanket annotation is not a design. The transaction boundary belongs on the use case, the application-service method, and should be as short as possible: no remote calls or slow work inside it, since it holds a database connection and row locks for its whole duration and a slow dependency then exhausts the pool. I would make sure the team understands propagation and rollback rules: a participating call joins the outer transaction, an exception passing through an inner proxy marks it rollback-only, checked exceptions do not roll back by default, REQUIRES_NEW needs a second connection, and self-invocation bypasses the proxy. Concurrency needs a deliberate choice as well: isolation level, optimistic locking with a version column or pessimistic locks, and readOnly for queries. Side effects such as emails or messages should happen after the commit, with a transactional event listener on AFTER_COMMIT or an outbox, instead of inside the transaction."
        keyPoints:
          - point: "Boundary on the use case (application service) and short: no remote calls inside, because it holds a connection and locks"
            keywords: ["use case", "application service", "short", "remote call", "connection"]
          - point: "Know propagation and rollback rules: joining, rollback-only, REQUIRES_NEW, checked exceptions, self-invocation"
            keywords: ["propagation", "requires_new", "rollback-only", "rollbackfor", "checked"]
          - point: "Handle concurrency deliberately: isolation, optimistic (@Version) or pessimistic locking, readOnly queries"
            keywords: ["isolation", "@version", "optimistic", "pessimistic", "readonly"]
          - point: "Do side effects after commit (AFTER_COMMIT listener, outbox) instead of inside the transaction"
            keywords: ["after_commit", "transactionaleventlistener", "outbox", "after the commit"]
        followUps:
          - when: missed
            point: 4
            prompt: "What does `@TransactionalEventListener(phase = AFTER_COMMIT)` give you, and what is its catch?"
            modelAnswer: "The listener runs only if the transaction actually commits, so no email or message goes out for work that was rolled back. The catch is that it runs after the commit: a failure in the listener cannot roll the business change back, the event is lost if the process crashes between commit and delivery (use a transactional outbox when that matters), and database work done in the listener needs its own transaction, for example REQUIRES_NEW, because the original one is already complete."
            keyPoints:
              - point: "Runs only if the transaction commits, so nothing is sent for rolled-back work"
                keywords: ["only if", "rolled back", "actually commits"]
              - point: "A listener failure cannot undo the change, and the event can be lost on a crash (use an outbox)"
                keywords: ["lost", "crash", "outbox"]
              - point: "Database work in the listener needs its own transaction"
                keywords: ["requires_new", "own transaction", "new transaction"]
          - when: covered
            point: 1
            prompt: "Why is it dangerous to keep a transaction open across an HTTP call to another service?"
            modelAnswer: "The transaction holds a database connection and usually row locks for the whole duration of the call. When the remote service is slow, connections stay busy longer, the pool is exhausted and unrelated requests start to wait, while the locks block other writers. The remote effect also cannot be rolled back together with the database. Make the call before or after the transaction, or publish an event through an outbox."
            keyPoints:
              - point: "Holds a connection, so a slow call exhausts the pool"
                keywords: ["connection", "pool"]
              - point: "Row locks block other writers"
                keywords: ["lock"]
              - point: "The remote effect cannot be rolled back with the database"
                keywords: ["rolled back", "roll back", "rollback"]
