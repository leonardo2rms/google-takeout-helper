id: scale
title: Scale & Performance
icon: network
description: Load, caching, pools and the resilience patterns that keep microservices alive under pressure.
lessons:
  - id: scale-load
    title: Load & latency
    questions:
      - type: estimate
        hint: "Little's Law links concurrency, throughput and latency by a simple multiplication."
        prompt: "By Little's Law (L = λ x W), a service handles 200 requests/second with an average latency of 0.25 s. How many requests are in flight on average?"
        answer: 50
        tolerance: 0
        unit: requests
        explanation: "L = 200 x 0.25 = 50. This is how you size thread/connection pools: if each in-flight request holds a DB connection for its full duration, you need about 50 connections at that load (more for headroom)."

      - type: single
        hint: "CPU is idle, so what are the request threads waiting for?"
        prompt: "Latency climbs sharply under load, yet CPU on both the app and the database is nearly idle. The app has 200 request threads and a HikariCP pool of 10. What is the most likely cause?"
        options:
          - { id: a, text: "Request threads are queuing for a connection because the pool is saturated" }
          - { id: b, text: "The JIT is recompiling hot methods in a loop and stalls request threads" }
          - { id: c, text: "Garbage collection is thrashing (full GCs back to back), so threads wait for the collector" }
          - { id: d, text: "The database is under-provisioned and needs more CPU cores to answer queries quicker" }
        answer: a
        explanation: "Idle CPUs plus rising latency means waiting. JIT recompilation, GC thrashing and a starved database all burn CPU, which is exactly what the stem rules out. Check pool metrics (active/pending/connection-acquire time) before touching anything else. Raising the pool blindly can overload the DB, so find out why connections are held so long first."

      - type: multi
        prompt: Select all sensible ways to reduce read load on a hot database.
        options:
          - { id: a, text: "Cache frequently-read, rarely-changed data" }
          - { id: b, text: "Route read-only queries to read replicas" }
          - { id: c, text: "Return projections and paginate instead of loading full entities" }
          - { id: d, text: "Index the columns that frequent slow queries filter and sort on" }
          - { id: e, text: "Retry timed-out queries at once and without a limit" }
        answers: [a, b, c, d]
        explanation: "Caching, replicas, lean projections and the right indexes each cut the work per read or move it elsewhere. Replicas need you to tolerate replication lag on those reads. Retrying timed-out queries immediately and indefinitely is a retry storm that turns a slowdown into an outage."

      - type: single
        hint: "Many callers reload the same value at once. How could one caller do the work for all of them?"
        prompt: A very popular cache key expires and 5,000 concurrent requests all miss and hit the database. What is this called, and what's a good mitigation?
        options:
          - { id: a, text: "Cache stampede, fixed by coalescing loads per key and adding TTL jitter" }
          - { id: b, text: "Cache poisoning, fixed by signing cached values and validating each entry on read" }
          - { id: c, text: "Cache eviction, fixed by a bigger cache with a smarter eviction policy such as LFU" }
          - { id: d, text: "Write-through, fixed by switching to write-behind so the database sees fewer synchronous writes" }
        answer: a
        explanation: "Also called thundering herd. Let one request recompute (single-flight) while others wait or serve slightly stale data, and spread expiry times so keys don't all expire together. Poisoning, eviction policy and write strategy do not address many concurrent misses on one expired key."

      - type: single
        hint: "Think about what an average does to a rare, very slow response."
        prompt: Why do SREs track p99 latency instead of just the average?
        options:
          - { id: a, text: "An average hides the tail, and with fan-out to many services a large share of requests hit it" }
          - { id: b, text: "p99 is cheaper to compute than an average, as it needs only the largest samples" }
          - { id: c, text: "The average is hard to compute across several instances, while percentiles can be merged" }
          - { id: d, text: "p99 excludes network time: it shows what the service itself is doing" }
        answer: a
        explanation: "If a page makes 20 backend calls, each with 1% slow outliers, ~18% of page loads hit at least one slow call (1 - 0.99^20). Tail latency amplifies with fan-out. It is the other way round for aggregation: averages combine easily, percentiles of separate instances cannot simply be merged. A percentile needs the whole distribution and includes network time like any other latency."

      - type: single
        prompt: "You want to add more instances of a service behind a load balancer, but users randomly get logged out. What is the likely blocker?"
        options:
          - { id: a, text: "Session state lives in one instance's memory, and the other instances behind the load balancer cannot see it" }
          - { id: b, text: "Load balancers forward raw TCP and do not route HTTP requests to several instances at once" }
          - { id: c, text: "Spring Boot applications are unable to run as more than one instance against the same database" }
          - { id: d, text: "Cookies are bound to a single server, so each instance would need its own cookie domain" }
        answer: a
        explanation: "Stateless services scale horizontally. Put session/state in Redis, a database, or a signed token (e.g. JWT) so that any instance can serve any request."

      - type: estimate
        hint: "Work out the chance that all 20 calls are fast, then take the opposite."
        prompt: "A page makes 20 independent backend calls, and each call is slow 1% of the time. What percentage of page loads hit at least one slow call? (A rough figure is fine.)"
        answer: 18.2
        tolerance: 0.05
        unit: "%"
        explanation: "The chance that all 20 are fast is 0.99^20 = 0.818, so at least one is slow with probability 1 - 0.818 = 18.2%. A 1% tail per call becomes an almost-1-in-5 experience for users: tail latency amplifies with fan-out."

      - type: single
        prompt: What is this log telling you, and what do you do first?
        code:
          lang: text
          source: |
            HikariPool-1 - Connection is not available, request timed out after 30000ms
            (total=10, active=10, idle=0, waiting=187)
        options:
          - { id: a, text: "The pool is exhausted: all 10 connections are busy and 187 requests wait, so check what holds them so long" }
          - { id: b, text: "The database is down: it refuses new connections, so restart it first and then lengthen the connection timeout" }
          - { id: c, text: "A network partition between app and database, so reconnect and add a retry" }
          - { id: d, text: "The JDBC driver is incompatible with this database, so upgrade the driver and redeploy" }
        answer: a
        explanation: "`active=10, idle=0, waiting=187` is saturation, not an outage: the database answered, but every connection is in use. The 30,000 ms is HikariCP's default `connectionTimeout`, and its default `maximumPoolSize` is 10. Look for slow queries, and for transactions that stay open across remote calls. A bigger pool only helps if the database has spare capacity."

      - type: code
        hint: "Compute the rank first, convert it to a 0-based index, and do not mutate the input."
        prompt: "Write `percentile(values, p)` using the nearest-rank method: sort ascending (`values` may be unsorted) and return the value at rank `ceil(p * n / 100)`, with `0 < p <= 100`."
        starter: |
          function percentile(values, p) {
            // your code
          }
        entry: percentile
        tests:
          - { args: [[15, 20, 35, 40, 50], 30], expect: 20 }
          - { args: [[15, 20, 35, 40, 50], 50], expect: 35 }
          - { args: [[50, 15, 40, 20, 35], 100], expect: 50 }
          - { args: [[7], 99], expect: 7 }
          - { args: [[10, 9, 100, 1], 50], expect: 9, hidden: true }
          - { args: [[3, 1, 2], 99], expect: 3, hidden: true }
        solution: |
          function percentile(values, p) {
            const sorted = [...values].sort((a, b) => a - b);
            const rank = Math.ceil((p * sorted.length) / 100);
            return sorted[rank - 1];
          }
        kotlin: |
          fun percentile(values: List<Int>, p: Int): Int {
              val sorted = values.sorted()
              val rank = (p * sorted.size + 99) / 100   // ceil(p * n / 100) in integer maths
              return sorted[rank - 1]
          }
        explanation: "Two traps: `Array.prototype.sort()` sorts as strings by default (10 < 9), so pass a numeric comparator; and compute `p * n / 100` with the multiplication first, because `p / 100 * n` can land on 98999.99999 instead of 99000 in floating point."

      - type: open
        prompt: "A downstream microservice suddenly gets 10x its normal traffic during a flash sale. Describe your plan to keep the system up."
        modelAnswer: "Combine capacity with protection. Make the service stateless and autoscale it, serve what you can from caches/CDN, and put a queue in front of non-urgent work to absorb the spike (asynchronous processing with backpressure). Protect dependencies with rate limiting and load shedding at the edge, timeouts, bulkheads and circuit breakers, so a slow dependency can't exhaust threads. Degrade gracefully (disable non-critical features, serve stale data) and prepare ahead with load tests, capacity planning and observability/alerts on saturation."
        keyPoints:
          - point: "Scale out (stateless, autoscaling) and reduce load with caching/CDN"
            keywords: ["autoscal", "scale out", "horizontal", "stateless", "cache", "cdn"]
          - point: "Absorb spikes with queues / async processing and backpressure"
            keywords: ["queue", "async", "asynchronous", "backpressure", "kafka", "buffer"]
          - point: "Protect with rate limiting/load shedding, timeouts, bulkheads, circuit breakers"
            keywords: ["rate limit", "load shed", "timeout", "bulkhead", "circuit breaker", "throttl"]
          - point: "Degrade gracefully and prepare with load testing and monitoring"
            keywords: ["degrad", "graceful", "stale", "load test", "capacity", "monitor", "alert", "observab"]

  - id: scale-resilience
    title: Resilience patterns
    questions:
      - type: single
        hint: "After the wait it does not simply close again: it tests the water first."
        prompt: A circuit breaker has been OPEN and its wait time elapses. What does it do next?
        options:
          - { id: a, text: "Moves to HALF-OPEN and lets a few trial calls through" }
          - { id: b, text: "Closes and lets the full traffic through again: the wait time has elapsed and the counters reset" }
          - { id: c, text: "Stays open until the next deployment, since only a restart resets the breaker" }
          - { id: d, text: "Replays every request that was rejected while it was open, all at once" }
        answer: a
        explanation: "CLOSED (normal) → OPEN (fail fast) → HALF-OPEN (probe) → CLOSED if the probes succeed, else back to OPEN. Failing fast gives the struggling dependency room to recover. In Resilience4j the defaults are a 60-second wait in OPEN and 10 permitted trial calls in HALF-OPEN, and the switch to HALF-OPEN happens on the first call after the wait unless `automaticTransitionFromOpenToHalfOpenEnabled` is set (it is off by default)."

      - type: single
        hint: "The server needs a way to recognise the same request when it arrives twice."
        prompt: "A client retries `POST /payments` after a timeout and the customer is charged twice. What is the standard fix?"
        options:
          - { id: a, text: "Add an idempotency key so the server replays the original result for a repeated request" }
          - { id: b, text: "Disable retries on the client: the payment API should never be called twice" }
          - { id: c, text: "Use GET instead of POST, so that caches and proxies deduplicate the repeated requests" }
          - { id: d, text: "Raise the timeout to 10 minutes, so the client never has to retry" }
        answer: a
        explanation: "The client can't know whether the first attempt succeeded, so never retrying loses payments and a longer timeout only delays the same problem. The server stores the idempotency key with the outcome (in the same transaction as the charge) and replays it on duplicates. Changing the verb does not help: a charge is not safe to repeat blindly."

      - type: multi
        prompt: Select all practices for safe retries.
        options:
          - { id: a, text: "Exponential backoff" }
          - { id: b, text: "Random jitter" }
          - { id: c, text: "Retry at once and without limit until it works" }
          - { id: d, text: "Retry only operations that are safe to repeat, such as those with an idempotency key" }
          - { id: e, text: "Retry at every layer of the call chain" }
        answers: [a, b, d]
        explanation: "Retrying at every layer multiplies traffic (3 layers × 3 attempts = 27 calls to the bottom service). Retry at one layer, with a budget, and jitter so clients don't synchronise."

      - type: single
        hint: "What puts an upper bound on how much a queue can hold?"
        prompt: "A consumer is slower than the producer feeding it through an unbounded in-memory queue. What happens, and what's the right design?"
        options:
          - { id: a, text: "Memory grows until OOM because nothing pushes back; bound the queue to slow the producer" }
          - { id: b, text: "Nothing happens; a queue self-balances once the consumer catches up on its own" }
          - { id: c, text: "The runtime notices the backlog and adds consumer threads, so the queue drains on its own" }
          - { id: d, text: "The queue discards the oldest items, which is safe because they are stale" }
        answer: a
        explanation: "Backpressure propagates 'slow down' upstream: bounded queues, `Flow` operators with buffers, reactive streams demand, or consumer lag-based autoscaling for Kafka. When the producer cannot be slowed (incoming client requests, say), a full queue should reject work instead, so callers fail fast."

      - type: single
        hint: "Think about limiting how much of a shared resource any one dependency may use."
        prompt: "One slow dependency (e.g. a reports API) uses up all your servlet threads, so unrelated endpoints also time out. Which pattern prevents this?"
        options:
          - { id: a, text: "Bulkhead, so each dependency gets its own thread pool" }
          - { id: b, text: "Sidecar, running the reports client in a separate proxy container next to the service" }
          - { id: c, text: "Strangler fig, routing the reports calls through a new facade and retiring the old one" }
          - { id: d, text: "Blue/green deployment, keeping a second environment ready to switch traffic over when one fails" }
        answer: a
        explanation: "Named after ship compartments: a leak in one doesn't sink the vessel. Pair with timeouts, because without them even a bulkhead's pool eventually fills with stuck calls. A sidecar moves cross-cutting code out of process, a strangler fig migrates a legacy system and blue/green is a release technique; none isolates resources per dependency."

      - type: single
        hint: "No distributed lock and no two-phase commit: what can you do about a failed step after earlier ones succeeded?"
        prompt: "An order spans three services, each with its own database. Which approach keeps data consistent without distributed locks?"
        options:
          - { id: a, text: "A saga of local transactions chained by messages, with compensating actions on failure" }
          - { id: b, text: "Two-phase commit across all three databases: it gives atomic commits at little cost" }
          - { id: c, text: "A shared database for the three services, so that a single local transaction covers everything" }
          - { id: d, text: "Retry each step forever without compensation and hope each service eventually succeeds" }
        answer: a
        explanation: "Sagas trade atomicity for availability and give eventual consistency. Design compensations (refund, release stock) and make every step idempotent. Two-phase commit holds locks across all participants and blocks when the coordinator fails, a shared database defeats the premise that each service owns its data, and retrying without compensation leaves partial orders."

      - type: order
        hint: "Which attempt must be allowed to throw to the caller, and where does that call sit relative to the loop?"
        prompt: "Arrange the lines to build a retry helper with exponential backoff: it waits 100 ms after the first failure and doubles the wait after each further one."
        lines:
          - "suspend fun <T> retry(times: Int, block: suspend () -> T): T {"
          - "    var delayMs = 100L"
          - "    repeat(times - 1) {"
          - "        try { return block() } catch (e: IOException) { }"
          - "        delay(delayMs)"
          - "        delayMs *= 2"
          - "    } // repeat"
          - "    return block()"
          - "}"
        explanation: "The wait happens after a failed attempt and before doubling. The final attempt is outside the loop so its exception propagates to the caller. In production add jitter and a cap on `delayMs`, and don't swallow CancellationException."

      - type: spot
        hint: "Which line has a side effect that is not safe to repeat when you cannot tell whether it succeeded?"
        prompt: A timeout here can charge the customer twice. Tap the line responsible.
        source: |
          fun charge(req: ChargeRequest): Receipt {
              repeat(3) {
                  try { return client.charge(req) } catch (e: IOException) { }
              }
              throw PaymentFailed()
          }
        answers: [3]
        explanation: "A timeout doesn't tell you the charge failed, only that you didn't hear back. Retrying a non-idempotent write immediately, with no idempotency key and no backoff, can apply it again. Send the same key on every attempt and back off between them."

      - type: estimate
        hint: "Retries multiply across layers rather than add."
        prompt: "Three layers of a call chain each retry a failed call up to 3 attempts. In the worst case, how many attempts reach the bottom service for ONE user request?"
        answer: 27
        tolerance: 0
        unit: attempts
        explanation: "Retries multiply across layers: 3 x 3 x 3 = 27. Retry at one layer only, with a retry budget, so a struggling dependency isn't hit by a retry storm."

      - type: match
        hint: "For each pattern, name the failure it is meant to contain."
        prompt: Match each pattern to the problem it solves.
        pairs:
          - { left: "Circuit breaker", right: "Fails fast while a dependency is unhealthy" }
          - { left: "Bulkhead", right: "Separate pools so one slow dependency can't starve the rest" }
          - { left: "Idempotency key", right: "Makes a retried write safe to repeat" }
          - { left: "Transactional outbox", right: "Commits a DB change and its event atomically" }
          - { left: "Backpressure", right: "Tells a fast producer to slow down for a slow consumer" }
        explanation: "Each pattern guards one failure mode, and they compose: timeouts and bulkheads limit the blast radius, breakers stop hammering a sick dependency, idempotency keys make retries safe, the outbox keeps data and events consistent."

      - type: order
        hint: "The relay can crash at any moment. When is it safe to mark something as sent?"
        kind: steps
        prompt: Put the steps of the transactional outbox in the right order.
        lines:
          - "The service writes the business row and an outbox row in one local transaction"
          - "The transaction commits, so both rows exist or neither does"
          - "A relay reads the unsent outbox rows"
          - "The relay publishes each event to the broker"
          - "The relay marks the outbox row as sent"
        explanation: "The row is marked as sent only after publishing. If the relay crashes in between, the event is published again on restart: at-least-once delivery, which is why consumers must be idempotent."

      - type: code
        hint: "Compute each delay from its index, then apply the cap last."
        prompt: "Write `backoffDelays(attempts, baseMs, capMs)`: the wait before each retry, doubling every time (`baseMs`, `2 x baseMs`, `4 x baseMs`, ...) but never more than `capMs`."
        starter: |
          function backoffDelays(attempts, baseMs, capMs) {
            // your code
          }
        entry: backoffDelays
        tests:
          - { args: [4, 100, 10000], expect: [100, 200, 400, 800] }
          - { args: [5, 100, 500], expect: [100, 200, 400, 500, 500] }
          - { args: [0, 100, 500], expect: [] }
          - { args: [1, 250, 1000], expect: [250] }
          - { args: [3, 1000, 1500], expect: [1000, 1500, 1500], hidden: true }
        solution: |
          function backoffDelays(attempts, baseMs, capMs) {
            return Array.from({ length: attempts }, (_, i) => Math.min(baseMs * 2 ** i, capMs));
          }
        kotlin: |
          fun backoffDelays(attempts: Int, baseMs: Long, capMs: Long): List<Long> =
              (0 until attempts).map { i -> minOf(baseMs * (1L shl minOf(i, 30)), capMs) }
        explanation: "Exponential backoff gives a struggling dependency room to recover; the cap keeps waits bounded. In production add random jitter so many clients don't retry in lockstep. Note the `minOf(i, 30)` in the Kotlin version: an unbounded shift would overflow."

      - type: open
        hint: "What goes wrong if you write to the database and publish to a broker as two separate steps?"
        prompt: Explain the transactional outbox pattern. What problem does it solve and how does it work?
        modelAnswer: "It solves the dual-write problem: updating your database and publishing a message to a broker can't be made atomic, so a crash between the two leaves them inconsistent. With an outbox, the service writes the event to an outbox table in the same local DB transaction as the business change. A separate relay (a polling publisher or change-data-capture such as Debezium) reads the outbox and publishes to the broker, marking rows as sent. Delivery is at-least-once, so consumers must be idempotent (deduplicate by event id)."
        keyPoints:
          - point: "Dual-write problem: DB change and message publish are not atomic"
            keywords: ["dual write", "dual-write", "atomic", "inconsisten", "crash between", "two systems"]
          - point: "Write the event to an outbox table in the same local transaction as the business data"
            keywords: ["same transaction", "outbox table", "single transaction", "local transaction", "atomically"]
          - point: "A relay/CDC process (polling publisher, Debezium) publishes events afterwards"
            keywords: ["relay", "cdc", "debezium", "polling", "publisher", "change data capture"]
          - point: "At-least-once delivery means consumers must be idempotent"
            keywords: ["at-least-once", "at least once", "idempoten", "dedup", "duplicate"]
        followUps:
          - when: covered
            point: 4
            prompt: "How does a consumer protect itself from receiving the same event twice?"
            modelAnswer: "By being idempotent. Give each event a unique id and record the processed ids in an inbox table (or behind a unique constraint) in the same transaction as the side effect, so a repeat becomes a no-op. Where possible make the operation itself idempotent, such as an upsert or 'set status to X', instead of 'add 1'."
            keyPoints:
              - point: "Events carry a unique id, and the consumer records the processed ids (inbox table or unique constraint)"
                keywords: ["unique id", "inbox", "unique constraint", "processed"]
              - point: "Record it in the same transaction as the side effect"
                keywords: ["same transaction"]
              - point: "Prefer naturally idempotent operations (upsert, set) over increments"
                keywords: ["upsert", "idempotent", "set"]
          - when: missed
            point: 3
            prompt: "Polling publisher or change data capture: how do you choose?"
            modelAnswer: "A polling publisher is simple: a scheduled job reads unsent outbox rows and publishes them, at the cost of extra database load, the latency of the polling interval, and care with ordering and multiple instances (use `SKIP LOCKED`). CDC tools such as Debezium read the database's transaction log, which gives low latency and preserves commit order, but add infrastructure to operate. Start with polling unless latency or volume demands CDC."
            keyPoints:
              - point: "Polling: simple, but adds DB load and latency and needs locking for multiple instances"
                keywords: ["polling", "load", "latency", "skip locked"]
              - point: "CDC (Debezium): reads the transaction log, low latency, preserves order"
                keywords: ["debezium", "log", "order"]
              - point: "Trade-off: operational complexity, so start simple"
                keywords: ["infrastructure", "complexity", "simple", "operate"]

  - id: scale-advanced
    title: Limits, consistency & queues
    questions:
      - type: code
        prompt: "Write `rateLimit(timestampsMs, capacity, refillPerSec)`, a token-bucket simulation. The bucket starts full with `capacity` tokens and refills continuously at `refillPerSec` tokens per second, never above `capacity`. For each request timestamp (ascending, in ms) return `true` and consume one token if at least one token is available, otherwise `false` (a denied request consumes nothing)."
        starter: |
          function rateLimit(timestampsMs, capacity, refillPerSec) {
            // your code
          }
        entry: rateLimit
        tests:
          - { args: [[0, 0, 0, 1000, 1000, 2000], 2, 1], expect: [true, true, false, true, false, true] }
          - { args: [[0, 500, 1000, 2000, 2500], 1, 0.5], expect: [true, false, false, true, false] }
          - { args: [[], 3, 1], expect: [] }
          - { args: [[0, 10000, 10000, 10000], 2, 1], expect: [true, true, true, false], hidden: true }
          - { args: [[0, 0, 0, 0, 0], 3, 0], expect: [true, true, true, false, false], hidden: true }
        solution: |
          function rateLimit(timestampsMs, capacity, refillPerSec) {
            let tokens = capacity;
            let last = timestampsMs.length ? timestampsMs[0] : 0;
            return timestampsMs.map((t) => {
              tokens = Math.min(capacity, tokens + ((t - last) / 1000) * refillPerSec);
              last = t;
              if (tokens >= 1) {
                tokens -= 1;
                return true;
              }
              return false;
            });
          }
        kotlin: |
          fun rateLimit(timesMs: List<Long>, capacity: Int, refillPerSec: Double): List<Boolean> {
              var tokens = capacity.toDouble()
              var last = timesMs.firstOrNull() ?: 0L
              return timesMs.map { t ->
                  tokens = minOf(capacity.toDouble(), tokens + (t - last) / 1000.0 * refillPerSec)
                  last = t
                  if (tokens >= 1.0) { tokens -= 1.0; true } else false
              }
          }
        explanation: "A token bucket lets a client burst up to `capacity` and then sustains `refillPerSec`. You don't need a timer: on each request compute how many tokens accrued since the last one, cap at `capacity`, then spend one. The cap is what the first hidden test checks (a long idle period must not bank unlimited tokens). In production the same logic runs atomically in a shared store, for example a Redis Lua script."

      - type: single
        prompt: "An overloaded service has a request queue that is 30 seconds deep, while its clients time out after 2 seconds. What is wrong with simply serving the queue in FIFO order, and what should you do?"
        options:
          - { id: a, text: "Most queued requests have already timed out at the client, so bound the queue and reject the excess early" }
          - { id: b, text: "Nothing is wrong: FIFO is the fairest order, so every request should wait its turn however long that takes" }
          - { id: c, text: "Add client retries, so that requests which timed out are repeated and eventually served from the queue" }
          - { id: d, text: "Make the queue unbounded and size the workers for peak load, so no request is ever rejected, however long it waits" }
        answer: a
        explanation: "Under sustained overload a long queue turns every request into one that is served too late: throughput of useful work (goodput) collapses even though the server is busy. Load shedding keeps latency bounded for the requests you accept: small queue, fail fast, drop work whose deadline has passed (some systems even serve newest-first under overload). Retries on top make the overload worse."

      - type: multi
        prompt: "One customer generates 40% of the traffic on a topic keyed by `customerId`, so one partition is overloaded while the others idle. Select all sound ways to deal with the hot key."
        options:
          - { id: a, text: "Spread the hot key over several sub-keys (key plus a random suffix) and combine the parts when reading" }
          - { id: b, text: "Simply add more partitions or brokers; the hot key's records then spread across them" }
          - { id: c, text: "Choose a partition key with higher cardinality or a composite key, if ordering allows it" }
          - { id: d, text: "Absorb the hot key's load in front of the shard by caching its reads and batching its writes" }
          - { id: e, text: "Replace the hash function with a faster one, so that the hot key is hashed to several partitions" }
        answers: [a, c, d]
        explanation: "Hashing sends all records with the same key to the same partition, so adding partitions or changing the hash function cannot split one key. You must change what is keyed (sub-keys, composite key) or take load off the shard (caching, batching). Splitting a key costs you per-key ordering and makes reads fan out, so it is applied only to the keys that are actually hot."

      - type: match
        prompt: Match each consistency model to its guarantee.
        pairs:
          - { left: "Linearizability", right: "Every operation appears to take effect atomically at one point between its start and its end, in an order consistent with real time" }
          - { left: "Sequential consistency", right: "All clients see the operations in one total order that respects each client's own order, but not necessarily real time" }
          - { left: "Read-your-writes", right: "A client always sees its own earlier writes" }
          - { left: "Monotonic reads", right: "A client never sees data move backwards in time across successive reads" }
          - { left: "Eventual consistency", right: "If writes stop, all replicas eventually converge to the same value" }
        explanation: "The first two are global orderings (the first adds real time and is the strongest and most expensive), the middle two are per-client session guarantees that fix most user-visible anomalies cheaply, and eventual consistency promises only convergence. Systems often let you choose per operation, for example reading from the leader after a write and from a replica otherwise."

      - type: single
        prompt: A user request has a 1 s limit. Service A calls B with a 2 s timeout and B calls C with a 3 s timeout. What is wrong with this setup?
        code:
          lang: text
          source: |
            user (1 s) -> A (timeout 2 s) -> B (timeout 3 s) -> C
        options:
          - { id: a, text: "A, B and C keep working after the user has given up; pass the remaining deadline down the chain" }
          - { id: b, text: "Nothing: timeouts should grow along the call chain to give deeper services more time" }
          - { id: c, text: "Only the first service in the chain needs a timeout, and the others follow its decision" }
          - { id: d, text: "Adding retries at each hop will compensate for the mismatch between the user's limit and the timeouts" }
        answer: a
        explanation: "Timeouts should shrink along the chain, ideally computed from a propagated deadline (gRPC deadlines are designed for this: the client sets one, it travels with the call as the remaining time, and servers can propagate it to downstream calls, which some implementations do by default (Java and Go) and others only when enabled (C++); with plain HTTP you pass the deadline or remaining budget in a header yourself). Then work is abandoned everywhere as soon as the caller has given up, and a service can refuse a request whose remaining budget is already too small to be useful."

      - type: single
        prompt: "With cache-aside, a write must update the database and invalidate the cached entry. Which order is generally safer, and why?"
        options:
          - { id: a, text: "Update the database first, then delete the cache entry, which keeps the stale window small" }
          - { id: b, text: "Delete the cache entry first, then update the database: this ensures that no stale value is read" }
          - { id: c, text: "Write the new value into the cache first, then the database, so readers see it at once" }
          - { id: d, text: "The order does not matter, because the cache and the database converge after the TTL anyway" }
        answer: a
        explanation: "If you delete first, a concurrent reader can miss, read the old row (the write has not committed yet) and put the old value back into the cache after your delete, where it stays until the TTL. Updating the database first shrinks the window to the moment between commit and delete (readers still hit the old cached value in that gap). A rare race remains, where a reader that missed before the commit writes its old value into the cache after your delete. No ordering is perfect without extra mechanisms (versioned values, short TTLs, change-data-capture driven invalidation), so always keep a TTL as a safety net."

      - type: single
        prompt: "Two regions both accept writes to the same record (active-active). Which design decision can you not avoid?"
        options:
          - { id: a, text: "How to resolve conflicts when both regions write the same record, for example with CRDTs and merges" }
          - { id: b, text: "Choosing a bigger instance type in each region so that both can absorb the write load" }
          - { id: c, text: "Switching the replication protocol from TCP to UDP to cut the cross-region latency" }
          - { id: d, text: "Nothing: modern databases make writes in two regions look sequential at no cost to latency" }
        answer: a
        explanation: "Cross-region latency (tens to hundreds of milliseconds) rules out synchronous coordination on every write, so two regions can accept conflicting updates. Last-writer-wins is simple but silently loses one update and depends on clocks; CRDTs and application merges preserve intent; a home region per key avoids conflicts at the price of cross-region latency for remote users. Strongly consistent multi-region databases exist, but they pay that latency on writes."

      - type: estimate
        prompt: "A flash sale sends 1,000 requests per second for 60 seconds into a queue. The workers process 400 requests per second. After the spike, arrivals drop to 100 per second. How many seconds after the spike ends does the queue take to drain?"
        answer: 120
        tolerance: 0
        unit: seconds
        explanation: "During the spike the queue grows by 1,000 - 400 = 600 per second, so 60 s leaves a backlog of 36,000 requests. Afterwards it shrinks by 400 - 100 = 300 per second: 36,000 / 300 = 120 s. A queue turns a short spike into a longer, flatter load (queue-based load levelling), but the request that arrives at the end of the spike still waits about 90 s (36,000 / 400) and the queue needs 120 s to empty, so it only suits work that can wait."

      - type: open
        difficulty: hard
        tags: [latency, tail-latency, hedged-requests]
        prompt: "A search fans out to 50 index shards, each with several replicas, and waits for all of them. A shard answers in 10 ms at the median but 200 ms at p99, so many searches are slow. Without making the shards faster, how would you cut the tail latency of a search?"
        modelAnswer: "A search is as slow as its slowest shard, so with 50 shards about 40% of searches (1 - 0.99^50) wait for at least one shard's p99: a rare tail per shard becomes the common case for the whole request. A slow reply is often caused by something temporary on one replica rather than by the request (a GC pause, a noisy neighbour, a background compaction), so I would send hedged requests: if a shard has not answered within about its p95 latency, send the same request to another replica of that shard, use whichever answer arrives first and cancel the other. Waiting until the p95 means only about 5% of shard calls are duplicated, so the extra load stays small. Because the work may run twice, I hedge only idempotent reads, and I cap hedges with a budget so that a real overload, where every replica is slow, is not doubled. Where the product allows it, I also give the whole search a deadline and return the results of the shards that answered in time, marked as partial, instead of waiting for the last straggler."
        keyPoints:
          - point: "The search waits for its slowest shard, so a rare tail per shard hits a large share of searches"
            keywords: ["slowest", "straggler", "at least one", "0.99"]
          - point: "Hedged requests: after about the p95 latency, send a duplicate to another replica, use the first answer and cancel the other"
            keywords: ["hedge", "hedging", "backup request", "another replica", "duplicate request"]
          - point: "Keep hedging safe: only idempotent reads, a small share of extra load, and a budget so an overload is not doubled"
            keywords: ["idempotent", "budget", "extra load", "read-only"]
          - point: "A deadline for the whole request, returning partial results from the shards that answered in time where the product allows it"
            keywords: ["partial", "deadline", "good enough", "in time"]
        followUps:
          - when: missed
            point: 3
            prompt: "You add hedging, and during an incident in which every replica is slow, the traffic to the shards almost doubles. Why, and how do you prevent it?"
            modelAnswer: "Hedging assumes that a slow reply is a random straggler on one replica. In an overload every call crosses the hedge delay, so nearly every call is sent twice, and the duplicates add load exactly where capacity is already short, which makes the slowdown worse. Cap hedges with a budget, for example a few percent of requests enforced by a token bucket, and stop hedging when it is used up; base the delay on a measured high percentile so that normal traffic rarely triggers it, and cancel the losing request as soon as one answer arrives."
            keyPoints:
              - point: "Under overload every call is slow, so nearly all are hedged and the extra load makes it worse"
                keywords: ["overload", "every call", "twice", "worse"]
              - point: "Cap hedges with a budget (a few percent of requests) and stop when it is used up"
                keywords: ["budget", "few percent", "token bucket"]
              - point: "Cancel the losing request once one answer arrives"
                keywords: ["cancel"]
          - when: covered
            point: 2
            prompt: "In which situations does hedging fail to cut the tail, even though p99 is high?"
            modelAnswer: "Hedging helps only when the slowness belongs to one replica at one moment, such as a GC pause, a noisy neighbour or a long queue on one machine, so that a second replica is likely to be fast. It does not help when the request itself is expensive, for example a query that scans a huge range, because it is just as slow on every replica, or when all replicas share the bottleneck, such as one database or a saturated network link. Then you have to make the work cheaper, split it or cache the result instead."
            keyPoints:
              - point: "It works when the delay is temporary and specific to one replica (GC pause, noisy neighbour, a long local queue)"
                keywords: ["one replica", "gc pause", "noisy neighbour", "temporary"]
              - point: "It fails when the request itself is expensive or all replicas share the bottleneck"
                keywords: ["expensive", "every replica", "share the bottleneck", "shared"]
