id: scale
title: Scale & Performance
emoji: "⚡"
color: "#ffc800"
description: Load, caching, pools and the resilience patterns that keep microservices alive under pressure.
lessons:
  - id: scale-load
    title: Load & latency
    questions:
      - type: estimate
        hint: "Little's Law links concurrency, throughput and latency by a simple multiplication."
        prompt: "By Little's Law (L = λ x W), a service handles 200 requests/second with an average latency of 0.25 s. How many requests are in flight on average?"
        answer: 50
        tolerance: 0
        unit: requests
        explanation: "L = 200 x 0.25 = 50. This is how you size thread/connection pools: if each in-flight request holds a DB connection for its full duration, you need about 50 connections at that load (more for headroom)."

      - type: single
        hint: "CPU is idle, so what are the request threads waiting for?"
        prompt: "Latency climbs sharply under load, yet CPU on both the app and the database is nearly idle. The app has 200 request threads and a HikariCP pool of 10. What is the most likely cause?"
        options:
          - { id: a, text: "Threads are queuing for a database connection (pool saturation)" }
          - { id: b, text: "The JIT is recompiling constantly" }
          - { id: c, text: "The GC is using all the CPU" }
          - { id: d, text: "The database needs more CPU cores" }
        answer: a
        explanation: "Idle CPUs plus rising latency means waiting. Check pool metrics (active/pending/connection-acquire time) before touching anything else. Raising the pool blindly can overload the DB, so find out why connections are held so long first."

      - type: multi
        prompt: Select ALL sensible ways to reduce read load on a hot database.
        options:
          - { id: a, text: "Cache frequently-read, rarely-changed data" }
          - { id: b, text: "Route read-only queries to read replicas" }
          - { id: c, text: "Return projections and paginate instead of loading full entities" }
          - { id: d, text: "Raise the connection pool size to 1,000" }
          - { id: e, text: "Retry timed-out queries immediately and indefinitely" }
        answers: [a, b, c]
        explanation: "Option D makes the database spend more time context-switching, and E is a retry storm that turns a slowdown into an outage. Replicas need you to tolerate replication lag on those reads."

      - type: single
        hint: "Many callers reload the same value at once. How could one caller do the work for all of them?"
        prompt: A very popular cache key expires and 5,000 concurrent requests all miss and hit the database. What is this called, and what's a good mitigation?
        options:
          - { id: a, text: "Cache stampede; coalesce loads (single-flight / lock per key), add TTL jitter or refresh ahead of expiry" }
          - { id: b, text: "Cache poisoning; encrypt the keys" }
          - { id: c, text: "Cache eviction; use a bigger cache" }
          - { id: d, text: "Write-through; switch to write-behind" }
        answer: a
        explanation: "Also called thundering herd. Let one request recompute while others wait or serve slightly stale data, and spread expiry times so keys don't all expire together."

      - type: single
        hint: "Think about what an average does to a rare, very slow response."
        prompt: Why do SREs track p99 latency instead of just the average?
        options:
          - { id: a, text: "Averages hide the slow tail; with fan-out (one request calling many services) most users experience the tail" }
          - { id: b, text: "p99 is cheaper to compute" }
          - { id: c, text: "The average is always equal to the median" }
          - { id: d, text: "p99 excludes network time" }
        answer: a
        explanation: "If a page makes 20 backend calls, each with 1% slow outliers, ~18% of page loads hit at least one slow call (1 - 0.99^20). Tail latency amplifies with fan-out."

      - type: single
        prompt: "You want to add more instances of a service behind a load balancer, but users randomly get logged out. What is the likely blocker?"
        options:
          - { id: a, text: "Session state kept in a single instance's memory; make it stateless or move it to a shared store" }
          - { id: b, text: "Load balancers cannot route HTTP" }
          - { id: c, text: "Spring Boot can't run more than one instance" }
          - { id: d, text: "The JVM shares sessions across processes automatically" }
        answer: a
        explanation: "Stateless services scale horizontally. Put session/state in Redis, a database, or a signed token (e.g. JWT) so that any instance can serve any request."

      - type: estimate
        hint: "Work out the chance that all 20 calls are fast, then take the opposite."
        prompt: "A page makes 20 independent backend calls, and each call is slow 1% of the time. What percentage of page loads hit at least one slow call? (A rough figure is fine.)"
        answer: 18.2
        tolerance: 0.05
        unit: "%"
        explanation: "The chance that all 20 are fast is 0.99^20 = 0.818, so at least one is slow with probability 1 - 0.818 = 18.2%. A 1% tail per call becomes an almost-1-in-5 experience for users: tail latency amplifies with fan-out."

      - type: single
        prompt: What is this log telling you, and what do you do first?
        code:
          lang: text
          source: |
            HikariPool-1 - Connection is not available, request timed out after 30000ms
            (total=10, active=10, idle=0, waiting=187)
        options:
          - { id: a, text: "The pool is exhausted: all 10 connections are busy and 187 requests are queued. Find out why connections are held so long before enlarging the pool" }
          - { id: b, text: "The database is down and needs a restart" }
          - { id: c, text: "A network partition between app and database" }
          - { id: d, text: "The JDBC driver version is wrong" }
        answer: a
        explanation: "`active=10, idle=0, waiting=187` is saturation, not an outage: the database answered, but every connection is in use. Look for slow queries, and for transactions that stay open across remote calls. A bigger pool only helps if the database has spare capacity."

      - type: code
        hint: "Compute the rank first, convert it to a 0-based index, and do not mutate the input."
        prompt: "Write `percentile(values, p)` using the nearest-rank method: sort ascending (`values` may be unsorted) and return the value at rank `ceil(p * n / 100)`, with `0 < p <= 100`."
        starter: |
          function percentile(values, p) {
            // your code
          }
        entry: percentile
        tests:
          - { args: [[15, 20, 35, 40, 50], 30], expect: 20 }
          - { args: [[15, 20, 35, 40, 50], 50], expect: 35 }
          - { args: [[50, 15, 40, 20, 35], 100], expect: 50 }
          - { args: [[7], 99], expect: 7 }
          - { args: [[10, 9, 100, 1], 50], expect: 9, hidden: true }
          - { args: [[3, 1, 2], 99], expect: 3, hidden: true }
        solution: |
          function percentile(values, p) {
            const sorted = [...values].sort((a, b) => a - b);
            const rank = Math.ceil((p * sorted.length) / 100);
            return sorted[rank - 1];
          }
        kotlin: |
          fun percentile(values: List<Int>, p: Int): Int {
              val sorted = values.sorted()
              val rank = (p * sorted.size + 99) / 100   // ceil(p * n / 100) in integer maths
              return sorted[rank - 1]
          }
        explanation: "Two traps: `Array.prototype.sort()` sorts as strings by default (10 < 9), so pass a numeric comparator; and compute `p * n / 100` with the multiplication first, because `p / 100 * n` can land on 98999.99999 instead of 99000 in floating point."

      - type: open
        prompt: "A downstream microservice suddenly gets 10x its normal traffic during a flash sale. Describe your plan to keep the system up."
        modelAnswer: "Combine capacity with protection. Make the service stateless and autoscale it, serve what you can from caches/CDN, and put a queue in front of non-urgent work to absorb the spike (asynchronous processing with backpressure). Protect dependencies with rate limiting and load shedding at the edge, timeouts, bulkheads and circuit breakers, so a slow dependency can't exhaust threads. Degrade gracefully (disable non-critical features, serve stale data) and prepare ahead with load tests, capacity planning and observability/alerts on saturation."
        keyPoints:
          - point: "Scale out (stateless, autoscaling) and reduce load with caching/CDN"
            keywords: ["autoscal", "scale out", "horizontal", "stateless", "cache", "cdn"]
          - point: "Absorb spikes with queues / async processing and backpressure"
            keywords: ["queue", "async", "asynchronous", "backpressure", "kafka", "buffer"]
          - point: "Protect with rate limiting/load shedding, timeouts, bulkheads, circuit breakers"
            keywords: ["rate limit", "load shed", "timeout", "bulkhead", "circuit breaker", "throttl"]
          - point: "Degrade gracefully and prepare with load testing and monitoring"
            keywords: ["degrad", "graceful", "stale", "load test", "capacity", "monitor", "alert", "observab"]

  - id: scale-resilience
    title: Resilience patterns
    questions:
      - type: single
        hint: "After the wait it does not simply close again: it tests the water first."
        prompt: A circuit breaker has been OPEN and its wait time elapses. What does it do next?
        options:
          - { id: a, text: "Moves to HALF-OPEN and lets a limited number of trial calls through to test whether the dependency recovered" }
          - { id: b, text: "Closes immediately and lets all traffic through" }
          - { id: c, text: "Stays open forever until restarted" }
          - { id: d, text: "Retries every queued request at once" }
        answer: a
        explanation: "CLOSED (normal) → OPEN (fail fast) → HALF-OPEN (probe) → CLOSED if the probes succeed, else back to OPEN. Failing fast gives the struggling dependency room to recover."

      - type: single
        hint: "The server needs a way to recognise the same request when it arrives twice."
        prompt: "A client retries `POST /payments` after a timeout and the customer is charged twice. What is the standard fix?"
        options:
          - { id: a, text: "Require an idempotency key so the server returns the original result for a repeated request" }
          - { id: b, text: "Never retry anything" }
          - { id: c, text: "Use GET instead of POST" }
          - { id: d, text: "Increase the timeout to 10 minutes" }
        answer: a
        explanation: "The client can't know whether the first attempt succeeded. The server stores the key with the outcome (in the same transaction as the charge) and replays it on duplicates."

      - type: multi
        prompt: Select ALL practices for safe retries.
        options:
          - { id: a, text: "Exponential backoff" }
          - { id: b, text: "Random jitter" }
          - { id: c, text: "Retry immediately and without limit until it works" }
          - { id: d, text: "Only retry idempotent operations (or ones with idempotency keys)" }
          - { id: e, text: "Retry at every layer of the call chain" }
        answers: [a, b, d]
        explanation: "Retrying at every layer multiplies traffic (3 layers × 3 attempts = 27 calls to the bottom service). Retry at one layer, with a budget, and jitter so clients don't synchronise."

      - type: single
        hint: "What puts an upper bound on how much a queue can hold?"
        prompt: "A consumer is slower than the producer feeding it through an unbounded in-memory queue. What happens, and what's the right design?"
        options:
          - { id: a, text: "Memory grows until OOM; use a bounded queue/backpressure so the producer slows down or work is rejected" }
          - { id: b, text: "Nothing; queues self-balance" }
          - { id: c, text: "The consumer speeds up automatically" }
          - { id: d, text: "The queue deletes the oldest items safely" }
        answer: a
        explanation: "Backpressure propagates 'slow down' upstream: bounded queues, `Flow` operators with buffers, reactive streams demand, or consumer lag-based autoscaling for Kafka."

      - type: single
        hint: "Think about limiting how much of a shared resource any one dependency may use."
        prompt: "One slow dependency (e.g. a reports API) uses up all your servlet threads, so unrelated endpoints also time out. Which pattern prevents this?"
        options:
          - { id: a, text: "Bulkhead: isolate resources (thread/semaphore pools) per dependency" }
          - { id: b, text: "Sidecar" }
          - { id: c, text: "Strangler fig" }
          - { id: d, text: "Blue/green deployment" }
        answer: a
        explanation: "Named after ship compartments: a leak in one doesn't sink the vessel. Pair with timeouts, because without them even a bulkhead's pool eventually fills with stuck calls."

      - type: single
        hint: "No distributed lock and no two-phase commit: what can you do about a failed step after earlier ones succeeded?"
        prompt: "An order spans three services, each with its own database. Which approach keeps data consistent without distributed locks?"
        options:
          - { id: a, text: "A saga: local transactions chained by events/commands, with compensating actions on failure" }
          - { id: b, text: "Two-phase commit across all databases as the default" }
          - { id: c, text: "A shared database for all services" }
          - { id: d, text: "Ignore failures; run a nightly job" }
        answer: a
        explanation: "Sagas trade atomicity for availability and give eventual consistency. Design compensations (refund, release stock) and make every step idempotent."

      - type: order
        hint: "Which attempt must be allowed to throw to the caller, and where does that call sit relative to the loop?"
        prompt: Arrange the lines to build a retry helper with exponential backoff.
        lines:
          - "suspend fun <T> retry(times: Int, block: suspend () -> T): T {"
          - "    var delayMs = 100L"
          - "    repeat(times - 1) {"
          - "        try { return block() } catch (e: IOException) { }"
          - "        delay(delayMs)"
          - "        delayMs *= 2"
          - "    }"
          - "    return block()"
          - "}"
        explanation: "The wait happens after a failed attempt and before doubling. The final attempt is outside the loop so its exception propagates to the caller. In production add jitter and a cap on `delayMs`, and don't swallow CancellationException."

      - type: spot
        hint: "Which line has a side effect that is not safe to repeat when you cannot tell whether it succeeded?"
        prompt: A timeout here can charge the customer twice. Tap the line responsible.
        source: |
          fun charge(req: ChargeRequest): Receipt {
              repeat(3) {
                  try { return client.charge(req) } catch (e: IOException) { }
              }
              throw PaymentFailed()
          }
        answers: [3]
        explanation: "A timeout doesn't tell you the charge failed, only that you didn't hear back. Retrying a non-idempotent write immediately, with no idempotency key and no backoff, can apply it again. Send the same key on every attempt and back off between them."

      - type: estimate
        hint: "Retries multiply across layers rather than add."
        prompt: "Three layers of a call chain each retry a failed call up to 3 attempts. In the worst case, how many attempts reach the bottom service for ONE user request?"
        answer: 27
        tolerance: 0
        unit: attempts
        explanation: "Retries multiply across layers: 3 x 3 x 3 = 27. Retry at one layer only, with a retry budget, so a struggling dependency isn't hit by a retry storm."

      - type: match
        hint: "For each pattern, name the failure it is meant to contain."
        prompt: Match each pattern to the problem it solves.
        pairs:
          - { left: "Circuit breaker", right: "Fails fast while a dependency is unhealthy" }
          - { left: "Bulkhead", right: "Separate pools so one slow dependency can't starve the rest" }
          - { left: "Idempotency key", right: "Makes a retried write safe to repeat" }
          - { left: "Transactional outbox", right: "Commits a DB change and its event atomically" }
          - { left: "Backpressure", right: "Tells a fast producer to slow down for a slow consumer" }
        explanation: "Each pattern guards one failure mode, and they compose: timeouts and bulkheads limit the blast radius, breakers stop hammering a sick dependency, idempotency keys make retries safe, the outbox keeps data and events consistent."

      - type: order
        hint: "The relay can crash at any moment. When is it safe to mark something as sent?"
        kind: steps
        prompt: Put the steps of the transactional outbox in the right order.
        lines:
          - "The service writes the business row and an outbox row in one local transaction"
          - "The transaction commits, so both rows exist or neither does"
          - "A relay reads the unsent outbox rows"
          - "The relay publishes each event to the broker"
          - "The relay marks the outbox row as sent"
        explanation: "The row is marked as sent only after publishing. If the relay crashes in between, the event is published again on restart: at-least-once delivery, which is why consumers must be idempotent."

      - type: code
        hint: "Compute each delay from its index, then apply the cap last."
        prompt: "Write `backoffDelays(attempts, baseMs, capMs)`: the wait before each retry, doubling every time (`baseMs`, `2 x baseMs`, `4 x baseMs`, ...) but never more than `capMs`."
        starter: |
          function backoffDelays(attempts, baseMs, capMs) {
            // your code
          }
        entry: backoffDelays
        tests:
          - { args: [4, 100, 10000], expect: [100, 200, 400, 800] }
          - { args: [5, 100, 500], expect: [100, 200, 400, 500, 500] }
          - { args: [0, 100, 500], expect: [] }
          - { args: [1, 250, 1000], expect: [250] }
          - { args: [3, 1000, 1500], expect: [1000, 1500, 1500], hidden: true }
        solution: |
          function backoffDelays(attempts, baseMs, capMs) {
            return Array.from({ length: attempts }, (_, i) => Math.min(baseMs * 2 ** i, capMs));
          }
        kotlin: |
          fun backoffDelays(attempts: Int, baseMs: Long, capMs: Long): List<Long> =
              (0 until attempts).map { i -> minOf(baseMs * (1L shl minOf(i, 30)), capMs) }
        explanation: "Exponential backoff gives a struggling dependency room to recover; the cap keeps waits bounded. In production add random jitter so many clients don't retry in lockstep. Note the `minOf(i, 30)` in the Kotlin version: an unbounded shift would overflow."

      - type: open
        hint: "What goes wrong if you write to the database and publish to a broker as two separate steps?"
        prompt: Explain the transactional outbox pattern. What problem does it solve and how does it work?
        modelAnswer: "It solves the dual-write problem: updating your database and publishing a message to a broker can't be made atomic, so a crash between the two leaves them inconsistent. With an outbox, the service writes the event to an outbox table in the same local DB transaction as the business change. A separate relay (a polling publisher or change-data-capture such as Debezium) reads the outbox and publishes to the broker, marking rows as sent. Delivery is at-least-once, so consumers must be idempotent (deduplicate by event id)."
        keyPoints:
          - point: "Dual-write problem: DB change and message publish are not atomic"
            keywords: ["dual write", "dual-write", "atomic", "inconsisten", "crash between", "two systems"]
          - point: "Write the event to an outbox table in the same local transaction as the business data"
            keywords: ["same transaction", "outbox table", "single transaction", "local transaction", "atomically"]
          - point: "A relay/CDC process (polling publisher, Debezium) publishes events afterwards"
            keywords: ["relay", "cdc", "debezium", "polling", "publisher", "change data capture"]
          - point: "At-least-once delivery means consumers must be idempotent"
            keywords: ["at-least-once", "at least once", "idempoten", "dedup", "duplicate"]
        followUps:
          - when: covered
            point: 4
            prompt: "How does a consumer protect itself from receiving the same event twice?"
            modelAnswer: "By being idempotent. Give each event a unique id and record the processed ids in an inbox table (or behind a unique constraint) in the same transaction as the side effect, so a repeat becomes a no-op. Where possible make the operation itself idempotent, such as an upsert or 'set status to X', instead of 'add 1'."
            keyPoints:
              - point: "Events carry a unique id, and the consumer records the processed ids (inbox table or unique constraint)"
                keywords: ["unique id", "inbox", "unique constraint", "processed"]
              - point: "Record it in the same transaction as the side effect"
                keywords: ["same transaction"]
              - point: "Prefer naturally idempotent operations (upsert, set) over increments"
                keywords: ["upsert", "idempotent", "set"]
          - when: missed
            point: 3
            prompt: "Polling publisher or change data capture: how do you choose?"
            modelAnswer: "A polling publisher is simple: a scheduled job reads unsent outbox rows and publishes them, at the cost of extra database load, the latency of the polling interval, and care with ordering and multiple instances (use `SKIP LOCKED`). CDC tools such as Debezium read the database's transaction log, which gives low latency and preserves commit order, but add infrastructure to operate. Start with polling unless latency or volume demands CDC."
            keyPoints:
              - point: "Polling: simple, but adds DB load and latency and needs locking for multiple instances"
                keywords: ["polling", "load", "latency", "skip locked"]
              - point: "CDC (Debezium): reads the transaction log, low latency, preserves order"
                keywords: ["debezium", "log", "order"]
              - point: "Trade-off: operational complexity, so start simple"
                keywords: ["infrastructure", "complexity", "simple", "operate"]
