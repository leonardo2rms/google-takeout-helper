id: complexity
title: Algorithms & Complexity
icon: chart-line
description: Read a snippet, name its Big-O, and know what the JVM collections really cost.
lessons:
  - id: complexity-reading
    title: Reading Big-O
    questions:
      - type: single
        prompt: What is the time complexity?
        code:
          source: |
            fun hasDuplicate(xs: List<Int>): Boolean {
                for (i in xs.indices) {
                    for (j in i + 1 until xs.size) {
                        if (xs[i] == xs[j]) return true
                    }
                }
                return false
            }
        options:
          - { id: a, text: "`O(n²)`" }
          - { id: b, text: "`O(n)`" }
          - { id: c, text: "`O(n log n)`" }
          - { id: d, text: "`O(2ⁿ)`" }
        answer: a
        explanation: "The inner loop runs n-1, n-2, ... 1 times: n(n-1)/2 comparisons, which is O(n²) in the worst case (no duplicates)."

      - type: single
        prompt: "What are the time and space complexity of this version?"
        code:
          source: |
            fun hasDuplicate(xs: List<Int>): Boolean {
                val seen = HashSet<Int>()
                for (x in xs) {
                    if (!seen.add(x)) return true
                }
                return false
            }
        options:
          - { id: a, text: "`O(n)` time, `O(n)` space" }
          - { id: b, text: "`O(n)` time, `O(1)` space" }
          - { id: c, text: "`O(n²)` time, `O(n)` space" }
          - { id: d, text: "`O(n log n)` time, `O(1)` space" }
        answer: a
        explanation: "One pass with expected O(1) hash operations, but the set can grow to n elements. You've traded memory for time. Sorting first gives O(n log n) time with O(1) extra space if you may mutate the input."

      - type: single
        prompt: What is the time complexity as a function of n?
        code:
          source: |
            fun f(n: Int) {
                var i = 1
                while (i < n) {
                    i *= 2
                }
            }
        options:
          - { id: a, text: "`O(log n)`, since `i` doubles on each pass" }
          - { id: b, text: "`O(n)`, since the loop runs until `i` reaches n" }
          - { id: c, text: "`O(√n)`, since doubling reaches n in half the steps" }
          - { id: d, text: "`O(1)`, since multiplying `i` takes constant time" }
        answer: a
        explanation: "`i` doubles each iteration, so it takes log₂(n) steps to reach n. Each multiplication is O(1), but the number of iterations is log n, not n, √n or a constant."

      - type: single
        prompt: What is the time complexity?
        code:
          source: |
            fun g(n: Int) {
                for (i in 0 until n) {
                    var j = n
                    while (j > 1) {
                        j /= 2
                    }
                }
            }
        options:
          - { id: a, text: "`O(n log n)`: n outer passes, each taking log n halving steps" }
          - { id: b, text: "`O(n²)`: n outer passes, each running up to n steps" }
          - { id: c, text: "`O(log n)`: `j` halves, so the outer loop barely matters" }
          - { id: d, text: "`O(n)`: halving is a single operation, so each outer pass is `O(1)`" }
        answer: a
        explanation: "The outer loop runs n times and the inner loop halves j each time: log n steps. The product is n log n."

      - type: single
        hint: "How many calls does each call fan out into, and how many distinct inputs are there?"
        prompt: "What is the time complexity of the naive recursive `fib`, and what does memoisation turn it into?"
        code:
          source: |
            fun fib(n: Int): Long =
                if (n < 2) n.toLong() else fib(n - 1) + fib(n - 2)
        options:
          - { id: a, text: "`O(2ⁿ)`, reduced to `O(n)` with memoisation" }
          - { id: b, text: "`O(n)`, reduced to `O(log n)` with memoisation" }
          - { id: c, text: "`O(n²)`, reduced to `O(n)` with memoisation" }
          - { id: d, text: "`O(n!)`, reduced to `O(n²)` with memoisation" }
        answer: a
        explanation: "The call tree roughly doubles at each level (tight bound ≈ 1.618ⁿ, commonly quoted as O(2ⁿ)). With a cache each value of n is computed once."

      - type: single
        hint: "For each element of `a`, what does a lookup in `b` cost?"
        prompt: "`a` has n elements and `b` has m elements (both `List<Int>`). What is the time complexity, and how do you improve it?"
        code:
          source: |
            val common = a.filter { it in b }
        options:
          - { id: a, text: "`O(n·m)`; turn `b` into a set first, which makes it `O(n + m)`" }
          - { id: b, text: "`O(n + m)`; no improvement is possible, since both lists have to be read once" }
          - { id: c, text: "`O(n)`; `in` on a list is `O(1)`, so the filter loop is what matters" }
          - { id: d, text: "`O(n log m)`; sort `b` first and then each lookup costs `O(1)`" }
        answer: a
        explanation: "`in` on a List is a linear scan. `val set = b.toSet()` costs O(m) once, then each `in` is expected O(1). A hidden O(n²) like this is one of the most common production performance bugs."

      - type: single
        prompt: "Why is building a big string like this O(n²) in the number of appends, and what is the fix?"
        code:
          source: |
            var s = ""
            for (i in 0 until n) {
                s += i.toString()
            }
        options:
          - { id: a, text: "Each `+=` allocates a new string and copies the old one into it; use a StringBuilder instead" }
          - { id: b, text: "Strings are stored as linked lists of characters, so each append walks the whole list" }
          - { id: c, text: "`toString` is `O(n)` in the number of digits, so each iteration is expensive; cache the results" }
          - { id: d, text: "It is `O(n)`; there is no problem, because the JIT turns the loop into one StringBuilder" }
        answer: a
        explanation: "Strings are immutable, so concatenation allocates a new string and copies both parts. Total copying is 1+2+...+n. The JIT does not merge appends across loop iterations, `toString` of a small number is cheap, and strings are not linked lists. `buildString { ... }` appends in amortised O(1)."

      - type: order
        prompt: Arrange the lines of an O(n) two-sum that returns the indices of two numbers adding up to `target`.
        lines:
          - "fun twoSum(nums: IntArray, target: Int): IntArray? {"
          - "    val seen = HashMap<Int, Int>()"
          - "    for ((i, x) in nums.withIndex()) {"
          - "        seen[target - x]?.let { return intArrayOf(it, i) }"
          - "        seen[x] = i"
          - "    } // for"
          - "    return null"
          - "}"
        explanation: "Look up the complement before inserting the current element, so an element is never paired with itself. One pass with expected O(1) map operations gives O(n) time and O(n) space, versus O(n²) for checking every pair."

      - type: estimate
        hint: "Use n x log2(n), and remember that 2^10 is about 1,000."
        prompt: "Sorting n = 1,000,000 elements takes about n x log2(n) comparisons. Roughly how many million comparisons is that?"
        answer: 20
        tolerance: 0.1
        unit: million
        explanation: "log2(1,000,000) is about 19.9, so n log n is about 19.9 million. Compare that with the 500,000 million (5 x 10^11) comparisons an O(n²) approach would need: that is the whole point of an n log n sort."

      - type: code
        hint: "Use a stack, and decide what to do with a closer that does not match the top."
        prompt: "Write `isBalanced(s)`: true if every `()`, `[]` and `{}` in the string is closed in the right order (other characters are ignored). The hidden tests include 400,000 characters, so aim for O(n)."
        starter: |
          function isBalanced(s) {
            // your code
          }
        entry: isBalanced
        tests:
          - { args: ["([]{})"], expect: true }
          - { args: ["([)]"], expect: false }
          - { args: [""], expect: true }
          - { args: ["(("], expect: false }
          - { args: ["}"], expect: false }
          - { args: ["a(b)c"], expect: true }
          - { args: { js: "['('.repeat(200000) + ')'.repeat(200000)]" }, expect: true, hidden: true }
          - { args: { js: "['('.repeat(200000) + ']'.repeat(200000)]" }, expect: false, hidden: true }
        timeoutMs: 3000
        solution: |
          function isBalanced(s) {
            const pairs = { ')': '(', ']': '[', '}': '{' };
            const stack = [];
            for (const c of s) {
              if (c === '(' || c === '[' || c === '{') stack.push(c);
              else if (c in pairs) {
                if (stack.pop() !== pairs[c]) return false;
              }
            }
            return stack.length === 0;
          }
        kotlin: |
          fun isBalanced(s: String): Boolean {
              val pairs = mapOf(')' to '(', ']' to '[', '}' to '{')
              val stack = ArrayDeque<Char>()
              for (c in s) {
                  when (c) {
                      '(', '[', '{' -> stack.addLast(c)
                      ')', ']', '}' -> if (stack.removeLastOrNull() != pairs[c]) return false
                  }
              }
              return stack.isEmpty()
          }
        explanation: "A stack matches each closer with the most recent opener in O(n). The tempting alternative, repeatedly deleting `()`, `[]` and `{}` pairs from the string, is O(n²): on 400,000 characters it runs out of time, which is what the hidden tests are for."

      - type: open
        format: code
        prompt: "Write `fun <T> List<T>.firstDuplicate(): T?` that returns the first element that has already appeared earlier in the list, or null. Aim for O(n)."
        modelAnswer: |
          fun <T> List<T>.firstDuplicate(): T? {
              val seen = HashSet<T>()
              for (x in this) {
                  if (!seen.add(x)) return x
              }
              return null
          }
        maxChars: 800
        keyPoints:
          - point: "Uses a hash-based set (HashSet / mutableSetOf / hashSetOf) to remember seen elements"
            keywords: ["hashset", "mutableSetOf", "hashSetOf", "set<", "set()", "linkedhashset"]
          - point: "Returns as soon as an element is already in the set (e.g. via add() returning false or contains)"
            keywords: ["add(", "contains", " in seen", "in set", "return x", "return it", "return item"]
          - point: "Returns null when no duplicate exists, and the whole thing is a single pass (O(n))"
            keywords: ["return null", "null"]

  - id: complexity-collections
    title: JVM collection costs
    questions:
      - type: single
        prompt: Which structure gives O(1) access to the i-th element?
        options:
          - { id: a, text: "ArrayList" }
          - { id: b, text: "LinkedList" }
          - { id: c, text: "TreeSet" }
          - { id: d, text: "ArrayDeque, by index" }
        answer: a
        explanation: "ArrayList is backed by an array. LinkedList.get(i) walks the nodes: O(n), and it is slower than ArrayList in practice for nearly everything because of pointer chasing. ArrayDeque has no index access."

      - type: single
        hint: "What does Java 8 do when a bucket's chain grows long?"
        prompt: "A HashMap's keys all collide into one bucket. On Java 8+, what is the typical lookup cost for Comparable keys?"
        options:
          - { id: a, text: "`O(log n)`, because a bucket that has many entries becomes a balanced tree" }
          - { id: b, text: "`O(n)`, because a collided bucket is always a linked list that has to be scanned" }
          - { id: c, text: "`O(1)`, because a hash lookup is constant time no matter how the keys collide" }
          - { id: d, text: "`O(n²)`, because each colliding entry has to be compared against each other" }
        answer: a
        explanation: "Since Java 8, a bucket with 8+ entries (and table size >= 64) becomes a red-black tree. It defends against hash-collision attacks and bad hashCode implementations, but a good hash function is still what makes lookups O(1)."

      - type: single
        hint: "Where do the other elements have to go when you insert at the front?"
        prompt: "What is the cost of `list.add(x)` on an `ArrayList` vs `list.add(0, x)`?"
        options:
          - { id: a, text: "Amortised `O(1)` at the end and `O(n)` at the front, since the elements have to shift" }
          - { id: b, text: "`O(1)` for both: the backing array is indexed directly" }
          - { id: c, text: "`O(n)` for both, because each add may copy the whole array" }
          - { id: d, text: "`O(log n)` for both, because the array is searched first" }
        answer: a
        explanation: "Appends occasionally trigger a resize-and-copy, but averaged over many appends each is O(1). Use ArrayDeque if you need cheap insertion at both ends."

      - type: multi
        prompt: Select all operations that run in O(log n).
        options:
          - { id: a, text: "TreeMap.get" }
          - { id: b, text: "PriorityQueue.peek" }
          - { id: c, text: "Collections.binarySearch on a sorted ArrayList" }
          - { id: d, text: "HashMap.get (expected)" }
          - { id: e, text: "ArrayDeque.addFirst" }
        answers: [a, c]
        explanation: "TreeMap is a red-black tree and binary search halves the range, so both are O(log n). PriorityQueue is a binary heap: offer and poll are O(log n), but peek only reads the root, which is O(1). HashMap.get (expected) and ArrayDeque.addFirst (amortised) are O(1) as well."

      - type: single
        prompt: "What is the complexity of this loop on an `ArrayList`, and what is a better data structure?"
        code:
          source: |
            while (list.isNotEmpty()) {
                process(list.removeAt(0))
            }
        options:
          - { id: a, text: "`O(n²)`, because each `removeAt(0)` shifts the rest; use an ArrayDeque instead" }
          - { id: b, text: "`O(n)`, since each removal is a single operation; nothing to improve" }
          - { id: c, text: "`O(n log n)`, since removal shifts log n elements; use a TreeSet" }
          - { id: d, text: "`O(1)` per iteration, because the list is accessed by index; fine as is" }
        answer: a
        explanation: "Each `removeAt(0)` shifts all remaining elements. If you just need to visit every element, `for (x in list)` is O(n). If it's a queue, use ArrayDeque."

      - type: fill
        hint: "Count occurrences per word first, then sort by those counts."
        prompt: Find the 3 most frequent words.
        template: |
          val counts = words.groupingBy { it }.[[1]]()
          val top = counts.entries
              .[[2]](compareByDescending { it.value })
              .take(3)
        bank: ["eachCount", "sortedWith", "sortedBy", "count", "groupBy", "maxOf"]
        answers: ["eachCount", "sortedWith"]
        explanation: "`groupingBy{}.eachCount()` builds Map<String, Int> in one O(n) pass. `sortedWith(comparator)` then sorts the entries in O(k log k) for k distinct words (`sortedBy` takes a selector, not a comparator). For a very large k and small top-N, a bounded min-heap does it in O(k log N)."

      - type: spot
        hint: "Look for a call inside the loop that itself scans the collection."
        prompt: This function runs in O(n²). Tap the line that makes it quadratic.
        source: |
          fun dedupe(xs: List<String>): List<String> {
              val out = mutableListOf<String>()
              for (x in xs) {
                  if (x !in out) out.add(x)
              }
              return out
          }
        answers: [4]
        explanation: "`x !in out` scans the list on every iteration: O(n) inside an O(n) loop. Track what you've seen in a HashSet (or use `xs.distinct()`, which does exactly that) to make it O(n)."

      - type: open
        prompt: When would you choose HashMap, LinkedHashMap or TreeMap?
        modelAnswer: "HashMap is the default for key lookups: expected O(1) get/put with no ordering guarantee. LinkedHashMap is a HashMap that also preserves insertion order (or access order with accessOrder=true), which makes it a simple LRU cache by overriding removeEldestEntry. TreeMap keeps keys sorted (natural order or a Comparator) at O(log n) per operation, which is what you need for ordered iteration or range/nearest queries such as subMap, floorKey and ceilingKey. For concurrent use, prefer ConcurrentHashMap."
        keyPoints:
          - point: "HashMap: expected O(1) lookups, unordered; the default choice"
            keywords: ["o(1)", "constant", "unordered", "no order", "default"]
          - point: "LinkedHashMap: predictable iteration order; access-order mode for LRU caches"
            keywords: ["insertion order", "access order", "accessorder", "lru", "removeeldest", "linkedhashmap"]
          - point: "TreeMap: sorted keys, O(log n), range/navigation queries (floor/ceiling/subMap)"
            keywords: ["sorted", "o(log n)", "range", "floorkey", "ceilingkey", "submap", "navigable", "comparator"]

  - id: complexity-advanced
    title: Windows, graphs & DP
    questions:
      - type: single
        prompt: "All numbers in `nums` are positive. There is a `while` loop inside a `for` loop: what is the time complexity of this sliding window?"
        code:
          source: |
            fun shortest(nums: IntArray, target: Int): Int {
                var best = Int.MAX_VALUE
                var sum = 0
                var left = 0
                for (right in nums.indices) {
                    sum += nums[right]
                    while (sum >= target) {
                        best = minOf(best, right - left + 1)
                        sum -= nums[left++]
                    }
                }
                return if (best == Int.MAX_VALUE) 0 else best
            }
        options:
          - { id: a, text: "`O(n)`: `left` never moves back, so the inner loop takes at most n steps overall" }
          - { id: b, text: "`O(n²)`: there is a loop nested inside a loop, so the work is quadratic" }
          - { id: c, text: "`O(n log n)`: each pointer move needs a lookup in a sorted structure" }
          - { id: d, text: "`O(n x target)`: the inner loop can repeat up to `target` times per step" }
        answer: a
        explanation: "Count the work per pointer, not per loop nesting: `right` advances n times and `left` advances at most n times, and neither ever moves back. That is amortised analysis, and it is the reason sliding windows and two-pointer techniques turn O(n²) scans into O(n). The positivity of the numbers is what makes shrinking the window safe."

      - type: code
        prompt: "Write `longestAtMostKDistinct(s, k)`: the length of the longest substring of `s` that contains at most `k` distinct characters. The hidden tests use strings of 200,000 characters, so aim for O(n)."
        starter: |
          function longestAtMostKDistinct(s, k) {
            // your code
          }
        entry: longestAtMostKDistinct
        tests:
          - { args: ["eceba", 2], expect: 3 }
          - { args: ["aa", 1], expect: 2 }
          - { args: ["", 3], expect: 0 }
          - { args: ["abc", 0], expect: 0 }
          - { args: ["abcabcabc", 2], expect: 2 }
          - { args: { js: "['ab'.repeat(100000), 2]" }, expect: 200000, hidden: true }
          - { args: { js: "['abcdefghij'.repeat(20000), 3]" }, expect: 3, hidden: true }
        solution: |
          function longestAtMostKDistinct(s, k) {
            if (k === 0) return 0;
            const counts = new Map();
            let left = 0;
            let best = 0;
            for (let right = 0; right < s.length; right++) {
              const c = s[right];
              counts.set(c, (counts.get(c) || 0) + 1);
              while (counts.size > k) {
                const l = s[left++];
                const n = counts.get(l) - 1;
                if (n === 0) counts.delete(l);
                else counts.set(l, n);
              }
              best = Math.max(best, right - left + 1);
            }
            return best;
          }
        kotlin: |
          fun longestAtMostKDistinct(s: String, k: Int): Int {
              if (k == 0) return 0
              val counts = HashMap<Char, Int>()
              var left = 0
              var best = 0
              for (right in s.indices) {
                  counts.merge(s[right], 1, Int::plus)
                  while (counts.size > k) {
                      val c = s[left++]
                      if (counts.merge(c, -1, Int::plus) == 0) counts.remove(c)
                  }
                  best = maxOf(best, right - left + 1)
              }
              return best
          }
        explanation: "Grow the window on the right, and when it holds more than `k` distinct characters shrink it from the left until it is valid again. A map of character counts tells you when a character has left the window completely. Each index enters and leaves the window once, so the whole thing is O(n). Checking every substring is O(n²) or worse and times out on the large hidden inputs."

      - type: estimate
        prompt: "About how many times must a search range of 1 to 1,000,000,000 be halved before a single candidate is left?"
        answer: 30
        tolerance: 0
        unit: halvings
        explanation: "2^30 = 1,073,741,824 is just above a billion, so log2(10^9) is about 29.9 and 30 halvings are enough. This is why 'binary search on the answer' is so powerful: even for answers up to a billion you need only about 30 feasibility checks, each of which is usually a single O(n) pass."

      - type: code
        prompt: "Koko has `piles` of bananas (positive integers) and `h` hours, with `h >= piles.length`. Each hour she picks one pile and eats up to `k` bananas from it. Write `minEatingSpeed(piles, h)`: the smallest integer `k` that lets her finish all piles within `h` hours. The hidden tests use piles of up to 10^9 bananas, so a linear search over `k` is too slow."
        starter: |
          function minEatingSpeed(piles, h) {
            // your code
          }
        entry: minEatingSpeed
        tests:
          - { args: [[3, 6, 7, 11], 8], expect: 4 }
          - { args: [[30, 11, 23, 4, 20], 5], expect: 30 }
          - { args: [[30, 11, 23, 4, 20], 6], expect: 23 }
          - { args: [[5], 5], expect: 1 }
          - { args: { js: "[Array(100000).fill(1e9), 100000]" }, expect: 1000000000, hidden: true }
          - { args: { js: "[[1e9], 2]" }, expect: 500000000, hidden: true }
        solution: |
          function minEatingSpeed(piles, h) {
            const hoursAt = (k) => {
              let hours = 0;
              for (const p of piles) {
                hours += Math.floor((p + k - 1) / k);
                if (hours > h) return hours;
              }
              return hours;
            };
            let lo = 1;
            let hi = 1;
            for (const p of piles) if (p > hi) hi = p;
            while (lo < hi) {
              const mid = lo + Math.floor((hi - lo) / 2);
              if (hoursAt(mid) <= h) hi = mid;
              else lo = mid + 1;
            }
            return lo;
          }
        kotlin: |
          fun minEatingSpeed(piles: IntArray, h: Int): Int {
              var lo = 1
              var hi = piles.max()
              while (lo < hi) {
                  val mid = lo + (hi - lo) / 2
                  val hours = piles.sumOf { (it.toLong() + mid - 1) / mid }
                  if (hours <= h) hi = mid else lo = mid + 1
              }
              return lo
          }
        explanation: "The question is a yes/no predicate, 'can she finish at speed k?', and it is monotonic: if k works, every larger k works too. So binary search the smallest k that works, between 1 and the largest pile (at that speed every pile takes one hour, so it always works). Each check is O(n), so the total is O(n log max(pile)). The first hidden test is a trap for linear search: it would need up to 10^9 checks of 100,000 piles."

      - type: match
        prompt: Match each problem to the technique that usually solves it.
        pairs:
          - { left: "Shortest subarray with a sum of at least a target, all numbers positive", right: "Sliding window" }
          - { left: "Smallest capacity for which a yes/no feasibility check passes, and feasibility is monotonic", right: "Binary search on the answer" }
          - { left: "After adding edges one by one, are two nodes connected?", right: "Union-Find (disjoint set)" }
          - { left: "Order tasks so every prerequisite comes first, or detect a cycle", right: "Topological sort (Kahn's algorithm)" }
          - { left: "All words that start with a given prefix", right: "Trie" }
          - { left: "The k largest items of a large stream", right: "Min-heap of size k" }
        explanation: "Interviews reward recognising the shape of a problem. Union-Find answers connectivity queries in near-constant amortised time with path compression and union by size; a trie shares prefixes so lookups cost the length of the word, not the number of words; Kahn's algorithm repeatedly removes nodes with no remaining prerequisites, and if nodes remain there is a cycle."

      - type: code
        prompt: "There are `n` courses numbered `0..n-1`. Each prerequisite `[course, pre]` means you must take `pre` before `course`. Write `canFinish(n, prerequisites)`: true if all courses can be completed, i.e. there is no cycle. The hidden tests include a chain of 100,000 courses, so avoid deep recursion."
        starter: |
          function canFinish(n, prerequisites) {
            // your code
          }
        entry: canFinish
        tests:
          - { args: [2, [[1, 0]]], expect: true }
          - { args: [2, [[1, 0], [0, 1]]], expect: false }
          - { args: [4, [[1, 0], [2, 1], [3, 2]]], expect: true }
          - { args: [3, []], expect: true }
          - { args: [1, [[0, 0]]], expect: false }
          - { args: { js: "[100000, Array.from({ length: 99999 }, (_, i) => [i + 1, i])]" }, expect: true, hidden: true }
          - { args: { js: "[100000, [...Array.from({ length: 99999 }, (_, i) => [i + 1, i]), [0, 99999]]]" }, expect: false, hidden: true }
        solution: |
          function canFinish(n, prerequisites) {
            const indegree = new Array(n).fill(0);
            const next = Array.from({ length: n }, () => []);
            for (const [course, pre] of prerequisites) {
              next[pre].push(course);
              indegree[course]++;
            }
            const queue = [];
            for (let i = 0; i < n; i++) if (indegree[i] === 0) queue.push(i);
            let done = 0;
            for (let head = 0; head < queue.length; head++) {
              done++;
              for (const c of next[queue[head]]) {
                if (--indegree[c] === 0) queue.push(c);
              }
            }
            return done === n;
          }
        kotlin: |
          fun canFinish(n: Int, prerequisites: List<IntArray>): Boolean {
              val indegree = IntArray(n)
              val next = List(n) { mutableListOf<Int>() }
              for ((course, pre) in prerequisites) {
                  next[pre].add(course)
                  indegree[course]++
              }
              val queue = ArrayDeque<Int>()
              for (i in 0 until n) if (indegree[i] == 0) queue.addLast(i)
              var done = 0
              while (queue.isNotEmpty()) {
                  val node = queue.removeFirst()
                  done++
                  for (c in next[node]) if (--indegree[c] == 0) queue.addLast(c)
              }
              return done == n
          }
        explanation: "Kahn's algorithm: start with the courses that have no prerequisites, 'take' them, and decrement the in-degree of the courses that depend on them. If every course ends up taken there is no cycle; if some never reach in-degree 0, they are on or behind a cycle. It is O(n + edges) and iterative. A recursive DFS is also O(n + edges) but needs a recursion depth equal to the longest chain, which overflows the call stack on the 100,000-course chain."

      - type: order
        prompt: "Arrange the lines of a bottom-up dynamic program that returns the fewest coins needed to make `amount`, or -1 if it is impossible. It runs in O(amount x coins)."
        lines:
          - "fun minCoins(coins: IntArray, amount: Int): Int {"
          - "    val dp = IntArray(amount + 1) { amount + 1 }"
          - "    dp[0] = 0"
          - "    for (a in 1..amount) {"
          - "        for (c in coins) if (c <= a) dp[a] = minOf(dp[a], dp[a - c] + 1)"
          - "    } // for a"
          - "    return if (dp[amount] > amount) -1 else dp[amount]"
          - "}"
        explanation: "`dp[a]` is the fewest coins for amount `a`. Every entry starts at 'impossible' (`amount + 1` is larger than any real answer), the base case `dp[0] = 0` comes before the loops, and each amount is built from smaller, already solved amounts: try every coin and take the best `dp[a - c] + 1`. Dynamic programming is recursion with memoisation turned upside down: the same sub-problems, solved in dependency order."

      - type: single
        prompt: "What are the time and extra space of the standard approach that finds the k largest of n values by scanning them once and keeping a min-heap of size k?"
        options:
          - { id: a, text: "`O(n log k)` time and `O(k)` extra space" }
          - { id: b, text: "`O(n log n)` time and `O(n)` extra space" }
          - { id: c, text: "`O(n)` time and `O(1)` extra space" }
          - { id: d, text: "`O(k log n)` time and `O(n)` extra space" }
        answer: a
        explanation: "Each of the n values is compared with the heap's root (the smallest of the k largest seen so far), which is O(1); only if it is larger does it replace the root, costing O(log k). So the worst case is O(n log k) with a heap of k elements. It beats sorting everything (O(n log n)) when k is much smaller than n, and it works on a stream that does not fit in memory. A min-heap, not a max-heap, because the element you may need to evict is the smallest of the survivors."

      - type: open
        prompt: "Given a huge log of search queries, you need the 10 most frequent queries. Walk through your approach, from one machine to data that does not fit in memory."
        modelAnswer: "Count first: one pass with a hash map from query to count is O(n) time and O(d) memory for d distinct queries. Then select the top 10 with a min-heap of size 10: for each of the d entries, compare with the heap's root and replace it if the count is larger, which is O(d log k) and avoids sorting all d entries in O(d log d). If the distinct queries do not fit in memory, partition the log by a hash of the query into shards (files or machines), so that every occurrence of a query lands in the same shard, count each shard separately, take each shard's top 10 and merge them; the global top 10 is among them. If an approximate answer is acceptable, a count-min sketch together with a heap of candidates uses fixed memory, at the price of overestimated counts."
        keyPoints:
          - point: "Count with a hash map in one pass: O(n) time, O(distinct) memory"
            keywords: ["hash map", "hashmap", "o(n)"]
          - point: "Select the top k with a min-heap of size k (O(d log k)) instead of sorting everything"
            keywords: ["min-heap", "heap", "log k"]
          - point: "If it does not fit in memory: partition by hash into shards, count each, merge the shard top-k lists"
            keywords: ["shard", "partition", "hash of"]
          - point: "If approximate is acceptable: a count-min sketch with fixed memory"
            keywords: ["count-min", "sketch", "approximate"]
        followUps:
          - when: missed
            point: 4
            prompt: "How does a count-min sketch estimate counts, and what kind of error does it have?"
            modelAnswer: "It keeps a small table of counters with several rows, each row with its own hash function. Adding an item increments one counter in every row, and to estimate an item's count you take the minimum of its counters across the rows. Collisions can only add to a counter, so the estimate is never below the true count and may be above it; more columns and rows reduce the error at the cost of memory."
            keyPoints:
              - point: "Several rows of counters, each with its own hash function; an add increments one counter per row"
                keywords: ["rows", "hash function"]
              - point: "The estimate is the minimum of the item's counters"
                keywords: ["minimum"]
              - point: "Collisions make it overestimate, never underestimate"
                keywords: ["overestimat", "never below", "collision"]
          - when: covered
            point: 3
            prompt: "Why partition by a hash of the query and not by splitting the log randomly?"
            modelAnswer: "With a hash partition every occurrence of the same query goes to the same shard, so each shard's counts are complete and its top 10 is exact. If the log were split randomly, the occurrences of one query would be spread over all shards, and a query could be missing from every shard's top 10 although its total is the largest."
            keyPoints:
              - point: "The same query always lands in the same shard, so counts are complete"
                keywords: ["same shard", "complete"]
              - point: "A random split spreads one query's count and can hide the global winner"
                keywords: ["spread", "random"]
